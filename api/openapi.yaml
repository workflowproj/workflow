        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/move:
    post:
      operationId: moveIssue
      tags: [issues]
      description: |
        Board and backlog drag-and-drop: optionally transition to a status, change sprint and re-rank
        between neighbours, atomically. Moving to a status whose transition needs a screen returns
        422 with code `screen_required`.
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/comments:
    get:
      operationId: listComments
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
  /comments/{commentId}:
    patch:
      operationId: updateComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/history:
    get:
      operationId: listIssueHistory
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Field changes, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEntry' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/metrics:
    get:
      operationId: getIssueMetrics
      tags: [issues]
      summary: Lead time, cycle time and time in each status, derived from the issue's history
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueMetrics' }
        default: { $ref: '#/components/responses/Problem' }
  # Time tracking: worklogs, the timesheet and the working day/week durations use.
  /issues/{issueKey}/worklogs:
    get:
      operationId: listWorklogs
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Work logged on the issue, in the order it was done
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Worklog' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addWorklog
      tags: [issues]
      description: |
        Log work on an issue (needs permission to edit it). The remaining estimate goes down by the
        time logged (never below zero) unless the request sets it (`remainingEstimateSeconds`) or
        asks to leave it (`adjustEstimate: leave`).
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorklogInput' }
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worklog' }
        default: { $ref: '#/components/responses/Problem' }
  /worklogs/{worklogId}:
    patch:
      operationId: updateWorklog
      tags: [issues]
      description: Change your own worklog (project admins can change anyone's). With `adjustEstimate` auto, the remaining estimate absorbs the difference.
      parameters: [{ name: worklogId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorklogPatch' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worklog' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteWorklog
      tags: [issues]
      description: Delete your own worklog (project admins can delete anyone's). By default the remaining estimate grows back by its time.
      parameters:
        - { name: worklogId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: adjustEstimate, in: query, schema: { $ref: '#/components/schemas/AdjustEstimate' } }
        - { name: remainingEstimateSeconds, in: query, description: 'Set the remaining estimate to this', schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /worklogs:
    get:
      operationId: getTimesheet
      tags: [metrics]
      summary: Timesheet, the time logged per person per day (and per issue) on issues you can browse
      parameters:
        - { name: from, in: query, required: true, description: First day, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: 'Last day (inclusive); at most 366 days after from', schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/MetricProjects' }
        - { name: user, in: query, description: Only this person's work, schema: { type: string, format: uuid } }
        - { name: tz, in: query, description: 'IANA time zone that days are counted in (default UTC)', schema: { type: string } }
      responses:
        "200":
          description: Totals per person and day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timesheet' }
        default: { $ref: '#/components/responses/Problem' }
  /time-tracking/settings:
    get:
      operationId: getTimeTrackingSettings
      tags: [issues]
      summary: The working day and week behind durations such as 1w 2d (WFM_TIME_HOURS_PER_DAY, WFM_TIME_DAYS_PER_WEEK)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeTrackingSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/links:
    post:
      operationId: createIssueLink
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetKey]
              properties:
                type: { $ref: '#/components/schemas/LinkType' }
                targetKey: { type: string }
                direction:
                  description: outward = "this issue <type> target"; inward reverses it.
                  type: string
                  enum: [outward, inward]
                  default: outward
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueLink' }
        default: { $ref: '#/components/responses/Problem' }
  /issue-links/{linkId}:
    delete:
      operationId: deleteIssueLink
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/LinkId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/watchers:
    get:
      operationId: listWatchers
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Watchers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addWatcher
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Omit userId to watch the issue yourself.
              properties:
                userId: { type: string, format: uuid }
      responses:
        "204": { description: Watching }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/watchers/{userId}:
    delete:
      operationId: removeWatcher
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/attachments:
    post:
      operationId: uploadAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        "200":
          description: File content
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a pre-signed object storage URL
          headers:
            Location: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/branches:
    post:
      operationId: createIssueBranch
      tags: [scm]
      summary: Create a branch named from the issue key and summary
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId]
              properties:
                repositoryId: { type: string, format: uuid }
                name: { type: string, description: Defaults to <key>-<summary-slug> }
                fromRef: { type: string, description: Defaults to the repository default branch }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevLink' }
        default: { $ref: '#/components/responses/Problem' }

