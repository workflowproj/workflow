  # Import from Jira (organisation admins): connect, choose projects, scan, map, dry-run, import.
  /admin/jira-imports:
    get:
      operationId: adminListJiraImports
      tags: [admin]
      summary: Imports from Jira, newest first
      responses:
        "200":
          description: Imports (without scan details)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: adminCreateJiraImport
      tags: [admin]
      summary: Connect a Jira site (the connection is tested first; the token is stored encrypted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JiraConnectionInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/test-connection:
    post:
      operationId: adminTestJiraConnection
      tags: [admin]
      summary: Check a Jira site URL and credentials without saving them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JiraConnectionInput' }
      responses:
        "200":
          description: The site answered and accepted the credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraConnectionTest' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetJiraImport
      tags: [admin]
      summary: An import with its configuration (unset mappings pre-filled), scan, targets and progress
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: adminUpdateJiraImport
      tags: [admin]
      summary: Save the projects and mapping, or enter new credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JiraImportPatch' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: adminDeleteJiraImport
      tags: [admin]
      summary: Delete the import record (imported data stays; re-importing the site still updates instead of duplicating)
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/credentials:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: adminDeleteJiraImportCredentials
      tags: [admin]
      summary: Forget the stored Jira token
      responses:
        "200":
          description: Credentials deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/jira-projects:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminListJiraProjects
      tags: [admin]
      summary: Projects the Jira account can browse
      responses:
        "200":
          description: Jira projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JiraProject' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/scan:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminScanJiraImport
      tags: [admin]
      summary: Analyse the selected projects in the background (counts, values in use, people)
      responses:
        "202":
          description: Scan started; poll the import for progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/dry-run:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminDryRunJiraImport
      tags: [admin]
      summary: What the import would do and the problems it would meet, without writing anything
      responses:
        "200":
          description: Dry run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraDryRun' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/run:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRunJiraImport
      tags: [admin]
      summary: Start the import, or resume an interrupted one, in the background
      responses:
        "202":
          description: Import started; poll the import for progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/jira-imports/{importId}/cancel:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminCancelJiraImport
      tags: [admin]
      summary: Stop the running scan or import after its current step
      responses:
        "200":
          description: Cancel requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JiraImport' }
        default: { $ref: '#/components/responses/Problem' }
  /scm/repositories:
    get:
