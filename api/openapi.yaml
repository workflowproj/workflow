      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        default: { $ref: '#/components/responses/Problem' }
  /sprints/{sprintId}:
    patch:
      operationId: updateSprint
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSprint
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      responses:
        "204": { description: Deleted; its issues return to the backlog }
        default: { $ref: '#/components/responses/Problem' }
  /sprints/{sprintId}/start:
    post:
      operationId: startSprint
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
