  /sprints/{sprintId}:
    patch:
      operationId: updateSprint
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintInput' }
      responses:
        "200":
          description: Updated
