    post:
      operationId: createRequestType
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestTypeInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestType' }
        default: { $ref: '#/components/responses/Problem' }
  /request-types/{requestTypeId}:
    put:
      operationId: updateRequestType
      tags: [service-desk]
      summary: Replace a request type (its form and approval included)
      parameters: [{ name: requestTypeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestTypeInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestType' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteRequestType
      tags: [service-desk]
      description: Refused (409) while requests use it.
      parameters: [{ name: requestTypeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
