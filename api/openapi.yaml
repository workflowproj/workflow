        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createRelease
      tags: [releases]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        default: { $ref: '#/components/responses/Problem' }
  /releases/{releaseId}:
    patch:
      operationId: updateRelease
      tags: [releases]
      parameters: [{ $ref: '#/components/parameters/ReleaseId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
