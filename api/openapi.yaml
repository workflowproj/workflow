      operationId: linkProjectRepository
      tags: [scm]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId]
              properties:
                repositoryId: { type: string, format: uuid }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScmRepository' }
        default: { $ref: '#/components/responses/Problem' }
