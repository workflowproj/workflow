      responses:
        "200":
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        default: { $ref: '#/components/responses/Problem' }
  /sprints/{sprintId}/complete:
    post:
      operationId: completeSprint
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                moveOpenIssuesTo:
                  description: Sprint id for unfinished issues; omit to return them to the backlog.
                  type: string
                  format: uuid
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        default: { $ref: '#/components/responses/Problem' }
  /sprints/{sprintId}/report:
    get:
      operationId: getSprintReport
      tags: [sprints]
      parameters: [{ $ref: '#/components/parameters/SprintId' }]
      responses:
        "200":
          description: Burndown and completion for the sprint
