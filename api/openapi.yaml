            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------------------
  # Issues
  # ---------------------------------------------------------------------------
  /timeline:
    get:
      operationId: getTimeline
      tags: [boards]
      summary: Epics and issues with dates, dependencies, sprints and releases across one or more projects
      parameters:
        - { name: projects, in: query, description: 'Comma-separated project keys; omit for every project you can browse', schema: { type: string } }
        - { name: jql, in: query, description: Optional extra JQL filter (e.g. assignee = currentUser()), schema: { type: string } }
        - { name: doneDays, in: query, description: 'Include issues resolved within this many days (default 90)', schema: { type: integer, minimum: 0, maximum: 3650 } }
      responses:
        "200":
          description: Timeline data. Sub-tasks are not included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timeline' }
        default: { $ref: '#/components/responses/Problem' }
  /dashboards:
    get:
      operationId: listDashboards
      tags: [dashboards]
      responses:
        "200":
          description: Your dashboards, then those others share with everyone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDashboard
      tags: [dashboards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
  /dashboards/{dashboardId}:
    get:
      operationId: getDashboard
      tags: [dashboards]
      parameters: [{ $ref: '#/components/parameters/DashboardId' }]
      responses:
        "200":
          description: The dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateDashboard
      tags: [dashboards]
      description: Owner or organisation admin only.
      parameters: [{ $ref: '#/components/parameters/DashboardId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteDashboard
      tags: [dashboards]
      parameters: [{ $ref: '#/components/parameters/DashboardId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [metrics]
      summary: Counts and totals for the matching issues (open, created and resolved in the window, overdue...)
      parameters: [{ $ref: '#/components/parameters/MetricProjects' }, { $ref: '#/components/parameters/MetricJql' }, { $ref: '#/components/parameters/MetricDays' }]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSummary' }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/flow:
    get:
      operationId: getCumulativeFlow
      tags: [metrics]
      summary: Cumulative flow, the number of matching issues in each status (or category) at the end of each day
      parameters:
        - { $ref: '#/components/parameters/MetricProjects' }
        - { $ref: '#/components/parameters/MetricJql' }
        - { $ref: '#/components/parameters/MetricDays' }
        - { name: by, in: query, schema: { type: string, enum: [category, status], default: category } }
      responses:
        "200":
          description: 'One series per category or status (todo, in progress, done). Issues resolved before the window are left out, so the done band is work finished in it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CumulativeFlow' }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/created-resolved:
    get:
      operationId: getCreatedResolved
      tags: [metrics]
      summary: Issues created and resolved per day or week, with the number open at the end of each
      parameters:
        - { $ref: '#/components/parameters/MetricProjects' }
        - { $ref: '#/components/parameters/MetricJql' }
        - { $ref: '#/components/parameters/MetricDays' }
        - { name: interval, in: query, schema: { type: string, enum: [day, week], default: day } }
      responses:
        "200":
          description: Buckets, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedResolved' }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/breakdown:
    get:
      operationId: getBreakdown
      tags: [metrics]
      summary: Matching issues grouped by a field, with counts and story points
      parameters:
        - { $ref: '#/components/parameters/MetricProjects' }
        - { $ref: '#/components/parameters/MetricJql' }
        - { name: by, in: query, required: true, schema: { $ref: '#/components/schemas/BreakdownBy' } }
      responses:
        "200":
          description: 'Groups, largest first ("None" last); priority and status category keep their natural order. An issue with several labels or releases counts in each.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Breakdown' }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/cycle-time:
    get:
      operationId: getCycleTimeMetrics
      tags: [metrics]
      summary: Cycle time of matching issues resolved in the window (first in progress to resolved)
      parameters: [{ $ref: '#/components/parameters/MetricProjects' }, { $ref: '#/components/parameters/MetricJql' }, { $ref: '#/components/parameters/MetricDays' }]
      responses:
        "200":
          description: Cycle times
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CycleTimeReport' }
        default: { $ref: '#/components/responses/Problem' }
  /search:
    get:
      operationId: searchIssues
      tags: [search]
      parameters:
        - { name: jql, in: query, schema: { type: string, default: '' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        "200":
          description: Matching issues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        default: { $ref: '#/components/responses/Problem' }
  /search/fields:
    get:
      operationId: getSearchMetadata
      tags: [search]
      summary: Fields, operators and functions for JQL autocompletion
      responses:
        "200":
          description: JQL metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchMetadata' }
        default: { $ref: '#/components/responses/Problem' }
  /filters:
    get:
      operationId: listFilters
      tags: [search]
      responses:
        "200":
          description: The caller's filters and filters shared with everyone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedFilter' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFilter
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedFilterInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        default: { $ref: '#/components/responses/Problem' }
  /filters/{filterId}:
    put:
      operationId: updateFilter
      tags: [search]
      parameters: [{ $ref: '#/components/parameters/FilterId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedFilterInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteFilter
      tags: [search]
      parameters: [{ $ref: '#/components/parameters/FilterId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues:
    post:
      operationId: createIssue
      tags: [issues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCreate' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}:
    get:
      operationId: getIssue
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateIssue
      tags: [issues]
      description: Send `version` to reject the write with 409 if someone else changed the issue first.
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePatch' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteIssue
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/transitions:
    get:
      operationId: listTransitions
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Transitions the caller may run (conditions already evaluated)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailableTransition' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: transitionIssue
      tags: [issues]
      description: Runs conditions and validators; a 422 problem lists failed validators.
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/move:
    post:
      operationId: moveIssue
      tags: [issues]
      description: |
        Board and backlog drag-and-drop: optionally transition to a status, change sprint and re-rank
        between neighbours, atomically. Moving to a status whose transition needs a screen returns
        422 with code `screen_required`.
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Issue' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/comments:
    get:
      operationId: listComments
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Comments, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
  /comments/{commentId}:
    patch:
      operationId: updateComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteComment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/history:
    get:
      operationId: listIssueHistory
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Field changes, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEntry' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/metrics:
    get:
      operationId: getIssueMetrics
      tags: [issues]
      summary: Lead time, cycle time and time in each status, derived from the issue's history
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueMetrics' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/links:
    post:
      operationId: createIssueLink
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetKey]
              properties:
                type: { $ref: '#/components/schemas/LinkType' }
                targetKey: { type: string }
                direction:
                  description: outward = "this issue <type> target"; inward reverses it.
                  type: string
                  enum: [outward, inward]
                  default: outward
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueLink' }
        default: { $ref: '#/components/responses/Problem' }
  /issue-links/{linkId}:
    delete:
      operationId: deleteIssueLink
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/LinkId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/watchers:
    get:
      operationId: listWatchers
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Watchers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addWatcher
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Omit userId to watch the issue yourself.
              properties:
                userId: { type: string, format: uuid }
      responses:
        "204": { description: Watching }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/watchers/{userId}:
    delete:
      operationId: removeWatcher
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/attachments:
    post:
      operationId: uploadAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Problem' }
  /attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        "200":
          description: File content
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a pre-signed object storage URL
          headers:
            Location: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAttachment
      tags: [issues]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/branches:
    post:
      operationId: createIssueBranch
      tags: [scm]
      summary: Create a branch named from the issue key and summary
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId]
              properties:
                repositoryId: { type: string, format: uuid }
                name: { type: string, description: Defaults to <key>-<summary-slug> }
                fromRef: { type: string, description: Defaults to the repository default branch }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevLink' }
        default: { $ref: '#/components/responses/Problem' }

