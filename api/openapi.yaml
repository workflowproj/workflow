  /projects/{projectKey}/customers:
    get:
      operationId: listServiceCustomers
      tags: [service-desk]
      parameters:
        - { $ref: '#/components/parameters/ProjectKey' }
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceCustomer' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: addServiceCustomer
      tags: [service-desk]
      summary: Add a customer by email
      description: |
        Someone new gets a customer account and an email invitation to choose a password (local
        accounts); an existing account (a customer of another project, an organisation member,
        a single sign-on user) is added as it is. Needs the customer.manage permission.
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCustomerInput' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCustomerAdded' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectKey}/customers/{userId}:
    delete:
      operationId: removeServiceCustomer
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectKey}/queues:
    get:
      operationId: listQueues
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      responses:
        "200":
          description: Queues in order, with the number of requests in each
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Queue' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createQueue
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        default: { $ref: '#/components/responses/Problem' }
  /queues/{queueId}:
    patch:
      operationId: updateQueue
      tags: [service-desk]
      parameters: [{ name: queueId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueInput' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteQueue
      tags: [service-desk]
      parameters: [{ name: queueId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /queues/{queueId}/issues:
    get:
      operationId: listQueueIssues
      tags: [service-desk]
      parameters:
        - { name: queueId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        "200":
          description: The queue's requests with their SLA clocks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueIssues' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectKey}/slas:
    get:
      operationId: getSlaConfig
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      responses:
        "200":
          description: Calendars and SLA goals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaConfig' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateSlaConfig
      tags: [service-desk]
      summary: Replace the calendars and SLA goals
      description: Calendars are matched by name. Open requests' clocks are recomputed in the background.
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlaConfig' }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaConfig' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/request:
    get:
      operationId: getServiceRequest
      tags: [service-desk]
      summary: A service request's request type, SLA clocks, approvals and participants (agents)
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateServiceRequest
      tags: [service-desk]
      summary: Set the request type (the portal shows only issues that have one)
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestPatch' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/participants:
    post:
      operationId: addRequestParticipant
      tags: [service-desk]
      summary: Share a request with someone who may use the portal
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantInput' }
      responses:
        "200":
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/participants/{userId}:
    delete:
      operationId: removeRequestParticipant
      tags: [service-desk]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /issues/{issueKey}/approvals/{approvalId}:
    post:
      operationId: decideApproval
      tags: [service-desk]
      summary: Approve or decline as one of the approvers
      parameters: [{ $ref: '#/components/parameters/IssueKey' }, { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/projects:
    get:
      operationId: listPortalDesks
      tags: [portal]
      summary: The help centre - service desks the caller may raise requests in
      responses:
        "200":
          description: Desks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalDesk' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/projects/{projectKey}:
    get:
      operationId: getPortalDesk
      tags: [portal]
      summary: A desk's request types and their forms
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      responses:
        "200":
          description: Desk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalDeskDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/projects/{projectKey}/requests:
    post:
      operationId: createPortalRequest
      tags: [portal]
      summary: Raise a request by filling in a request type's form
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalRequestCreate' }
      responses:
        "201":
          description: Raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalRequestDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/requests:
    get:
      operationId: listPortalRequests
      tags: [portal]
      summary: My requests - raised by the caller or shared with them
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, closed, all], default: all } }
        - { name: project, in: query, description: Desk (project key), schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        "200":
          description: Requests, most recently updated first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/requests/{issueKey}:
    get:
      operationId: getPortalRequest
      tags: [portal]
      summary: A request as its reporter, participants and approvers see it (no internal notes)
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalRequestDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/requests/{issueKey}/comments:
    post:
      operationId: addPortalComment
      tags: [portal]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalCommentInput' }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalComment' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/requests/{issueKey}/attachments:
    post:
      operationId: uploadPortalAttachment
      tags: [portal]
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAttachment' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/requests/{issueKey}/approval:
    post:
      operationId: decidePortalApproval
      tags: [portal]
      summary: Approve or decline a request waiting for the caller's decision
      parameters: [{ $ref: '#/components/parameters/IssueKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecision' }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalRequestDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/attachments/{attachmentId}:
    get:
      operationId: downloadPortalAttachment
      tags: [portal]
      parameters: [{ $ref: '#/components/parameters/AttachmentId' }]
      responses:
        "200":
          description: File content
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a pre-signed object storage URL
          headers:
            Location: { schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }
  /portal/approvals:
    get:
      operationId: listPortalApprovals
      tags: [portal]
      summary: Requests waiting for the caller's approval
      parameters: [{ $ref: '#/components/parameters/Limit' }]
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalRequest' }
        default: { $ref: '#/components/responses/Problem' }
  /portal/signup/{projectKey}:
    get:
      operationId: getPortalSignup
      tags: [portal]
      security: []
      summary: A desk that lets people sign up (404 unless self sign-up is on)
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      responses:
        "200":
          description: Desk
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSignupInfo' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: portalSignup
      tags: [portal]
      security: []
      summary: Create a customer account (confirmed by email)
      description: |
        Answers 202 the same way whether or not the address already has an account. A new
        address gets a customer account and an email to choose a password; an existing one gets
        an email saying how to sign in. Throttled like the sign-in endpoints.
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalSignup' }
      responses:
        "202": { description: Check your email }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------------------
  # Live updates
  # ---------------------------------------------------------------------------
  /events:
    get:
      operationId: streamEvents
      tags: [handwritten]
      summary: Server-sent events for open boards and issue views
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: "`text/event-stream` of `issue.created`, `issue.updated`, `issue.deleted`, `board.updated` events"
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wfm_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token or service-account token (`wfm_pat_...`)

  parameters:
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    Offset:
      { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    ProjectKey:
      { name: projectKey, in: path, required: true, description: Project key (or id), schema: { type: string } }
    IssueKey:
      { name: issueKey, in: path, required: true, description: Issue key such as PLAT-12 (or id), schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleId: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    TokenId: { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    MemberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    TypeId: { name: typeId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkflowId: { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
    BoardId: { name: boardId, in: path, required: true, schema: { type: string, format: uuid } }
    SprintId: { name: sprintId, in: path, required: true, schema: { type: string, format: uuid } }
    DashboardId: { name: dashboardId, in: path, required: true, schema: { type: string, format: uuid } }
    MetricProjects: { name: projects, in: query, description: 'Comma-separated project keys; omit for every project you can browse', schema: { type: string } }
    MetricJql: { name: jql, in: query, description: 'Optional query the issues must also match', schema: { type: string } }
    MetricDays: { name: days, in: query, description: Window in days, ending today, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
    CommentId: { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    LinkId: { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    FilterId: { name: filterId, in: path, required: true, schema: { type: string, format: uuid } }
    ConnectionId: { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    RepositoryId: { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    WebhookId: { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }
    ChannelId: { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    FieldId: { name: fieldId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    GrantId: { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Machine-readable error code, e.g. transition_not_allowed' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        position: { type: integer, description: Character offset of a query syntax error }
    FieldError:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }

    OrgRole: { type: string, enum: [admin, member, guest, customer] }
    StatusCategory: { type: string, enum: [todo, in_progress, done] }
    Priority: { type: string, enum: [highest, high, medium, low, lowest] }
    LinkDirection: { type: string, enum: [outward, inward] }
    LinkType: { type: string, enum: [blocks, relates, duplicates, clones] }
    TokenScope:
      type: string
      enum: [read, write, admin]
      description: read = GET only; write = all project and issue operations; admin = organisation administration (if the owner is an admin).

    AuthProviders:
      type: object
      required: [providers, devLogin, localLogin]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/AuthProvider' }
        devLogin: { type: boolean }
        localLogin: { type: boolean, description: Email and password sign-in for local accounts (WFM_LOCAL_LOGIN) }
    AuthProvider:
      type: object
      required: [id, name, loginUrl]
      properties:
        id: { type: string }
        name: { type: string }
        loginUrl: { type: string }
    UserKind: { type: string, enum: [human, service] }
    UserSource: { type: string, enum: [jit, scim, google, keycloak, admin, dev, system] }

    User:
      type: object
      required: [id, displayName, email, kind]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        avatarUrl: { type: string }
        kind: { $ref: '#/components/schemas/UserKind' }
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [orgRole, source]
          properties:
            orgRole: { $ref: '#/components/schemas/OrgRole' }
            source: { $ref: '#/components/schemas/UserSource', description: 'Where the account is managed; scim and google profiles are read-only here' }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [username, orgRole, active, source, createdAt]
          properties:
            username: { type: string }
            orgRole: { $ref: '#/components/schemas/OrgRole' }
            effectiveOrgRole: { $ref: '#/components/schemas/OrgRole' }
            active: { type: boolean }
            source: { $ref: '#/components/schemas/UserSource' }
            googleLinked: { type: boolean }
            lastLoginAt: { type: string, format: date-time }
            deactivatedAt: { type: string, format: date-time }
            deletedAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            localAccount: { $ref: '#/components/schemas/LocalAccountStatus' }
    LocalAccountStatus:
      type: object
      description: Present for people who sign in with a password here (or are invited to).
      required: [status, totpEnabled]
      properties:
        status:
          type: string
          enum: [invited, active, password_change_required]
          description: invited = no password yet; password_change_required = a temporary password is set
        invitationExpiresAt: { type: string, format: date-time }
        totpEnabled: { type: boolean }
        lockedUntil: { type: string, format: date-time, description: Set while locked after repeated failures }
        passwordChangedAt: { type: string, format: date-time }
    LocalLoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [signed_in, totp_required, password_change_required, totp_enrollment_required] }
        me: { $ref: '#/components/schemas/Me' }
        displayName: { type: string, description: 'With password_change_required: the name a new password must not contain' }
        recoveryCodes:
          description: After two-factor enrolment at sign-in; shown only once.
          type: array
          items: { type: string }
    TotpSetup:
      type: object
      required: [secret, otpauthUri, qrCode]
      properties:
        secret: { type: string, description: Base32 secret for manual entry }
        otpauthUri: { type: string }
        qrCode: { type: string, description: 'The otpauth URI as a QR code: a data: URI of an SVG image' }
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes: { type: array, items: { type: string } }
    MySecurity:
      type: object
      required: [localLoginEnabled, localAccount, totpEnabled, recoveryCodesRemaining, require2fa]
      properties:
        localLoginEnabled: { type: boolean }
        localAccount: { type: boolean, description: You have a password here }
        passwordChangedAt: { type: string, format: date-time }
        totpEnabled: { type: boolean }
        totpEnabledAt: { type: string, format: date-time }
        recoveryCodesRemaining: { type: integer }
        require2fa: { type: boolean, description: Two-factor authentication is required for local accounts }
    LocalLink:
      type: object
      required: [purpose, email, displayName]
      properties:
        purpose: { type: string, enum: [invite, reset] }
        email: { type: string }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time }
    PasswordCheck:
      type: object
      required: [score, label, problems, acceptable]
      properties:
        score: { type: integer, minimum: 0, maximum: 4, description: '0 not allowed, 1 weak, 2 fair, 3 good, 4 strong' }
        label: { type: string }
        problems: { type: array, items: { type: string } }
        acceptable: { type: boolean }
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/TokenScope' } }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    ApiTokenCreate:
      type: object
      required: [name, scopes, expiresInDays]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TokenScope' } }
        expiresInDays: { type: integer, minimum: 1, maximum: 366 }
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token: { type: string }
    Group:
      type: object
      required: [id, displayName, description, source, memberCount]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        description: { type: string }
        source: { $ref: '#/components/schemas/GroupSource' }
        email: { type: string }
        orgRole: { $ref: '#/components/schemas/OrgRole' }
        memberCount: { type: integer }
    GroupSource:
      type: string
      description: 'local: managed here. scim, google, keycloak: synced from that directory. oidc: from a sign-in token''s groups claim.'
      enum: [local, scim, google, keycloak, oidc]
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          required: [members]
          properties:
            members: { type: array, items: { $ref: '#/components/schemas/User' } }
    Role:
      type: object
      required: [id, key, name, description, permissions, builtin]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
        builtin: { type: boolean }
    RoleInput:
      type: object
      required: [key, name, permissions]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
    PermissionInfo:
      type: object
      required: [key, description]
      properties:
        key: { type: string }
        description: { type: string }
    AuditEvent:
      type: object
      required: [id, actorType, action, data, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/User' }
        actorType: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        projectId: { type: string, format: uuid }
        data: { type: object, additionalProperties: true }
        ip: { type: string }
        createdAt: { type: string, format: date-time }
    ProvisioningStatus:
      type: object
      required: [oidc, scim, directorySync]
      properties:
        oidc: { $ref: '#/components/schemas/OidcStatus' }
        scim: { $ref: '#/components/schemas/ScimStatus' }
        directorySync: { $ref: '#/components/schemas/DirectorySyncStatus' }
    OidcStatus:
      type: object
      required: [providers, allowedDomains, jitProvisioning, bootstrapAdmins]
      properties:
        providers: { type: array, items: { type: string } }
        allowedDomains: { type: array, items: { type: string } }
        jitProvisioning: { type: boolean }
        bootstrapAdmins: { type: array, items: { type: string } }
    ScimStatus:
      type: object
      required: [baseUrl, connections]
      properties:
        baseUrl: { type: string }
        connections: { type: array, items: { $ref: '#/components/schemas/ScimConnection' } }
    DirectorySyncStatus:
      type: object
      required: [configured, intervalMinutes, runs]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [google, keycloak], description: The configured directory (absent when none is) }
        intervalMinutes: { type: integer, description: Minutes between scheduled runs; 0 means manual runs only }
        group: { type: string, description: 'Access group: a Google group email, or a Keycloak group path' }
        orgUnit: { type: string }
        syncGroups: { type: boolean, description: Groups are mirrored too }
        groupPrefix: { type: string, description: Only groups whose email (Google) or name (Keycloak) starts with this are mirrored }
        url: { type: string, description: Keycloak base URL }
        realm: { type: string, description: Keycloak realm }
        provider: { type: string, description: 'Sign-in provider (WFM_OIDC_PROVIDERS id) whose subjects are the Keycloak user ids' }
        runs: { type: array, items: { $ref: '#/components/schemas/DirectorySyncRun' } }
    ScimConnection:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        userCount: { type: integer }
        groupCount: { type: integer }
    ScimConnectionCreated:
      allOf:
        - $ref: '#/components/schemas/ScimConnection'
        - type: object
          required: [token, baseUrl]
          properties:
            token: { type: string }
            baseUrl: { type: string }
    DirectorySyncRun:
      type: object
      required: [id, trigger, source, status, stats, startedAt]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string }
        source: { type: string, enum: [google, keycloak], description: The directory that was synced }
        status: { type: string, enum: [running, succeeded, failed] }
        stats: { type: object, additionalProperties: { type: integer } }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    Status:
      type: object
      required: [id, name, category]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }

    ProjectTemplate:
      type: object
      required: [id, name, description, boardType, issueTypes, workflows]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        boardType: { $ref: '#/components/schemas/BoardType' }
        issueTypes:
          type: array
          items: { $ref: '#/components/schemas/TemplateIssueType' }
        workflows: { type: array, items: { type: string } }
    TemplateIssueType:
      type: object
      required: [key, name, level]
      properties:
        key: { type: string }
        name: { type: string }
        level: { type: integer }
    Project:
      type: object
      required: [id, key, name, description, template, access, createdAt, myPermissions]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        lead: { $ref: '#/components/schemas/User' }
        template: { type: string }
        access: { $ref: '#/components/schemas/ProjectAccess' }
        openRoleKey: { type: string }
        keyAliases: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        myPermissions: { type: array, items: { type: string } }
    ProjectAccess: { type: string, enum: [open, private] }
    ProjectCreate:
      type: object
      required: [key, name, template]
      properties:
        key: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        template: { type: string }
        access: { $ref: '#/components/schemas/ProjectAccess' }
        openRoleKey: { type: string, default: member }
    ProjectPatch:
      type: object
      properties:
        key: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$', description: Renaming keeps the old key as an alias }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        leadId: { type: [string, 'null'], format: uuid }
        access: { $ref: '#/components/schemas/ProjectAccess' }
        openRoleKey: { type: string }
    ProjectMember:
      type: object
      required: [id, role]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
        group: { $ref: '#/components/schemas/Group' }
        role: { $ref: '#/components/schemas/Role' }
    IssueType:
      type: object
      required: [id, key, name, description, icon, color, level, position, workflowId, workflowName]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        level: { type: integer, description: 'Hierarchy level: epic 1, standard 0, sub-task -1' }
        position: { type: integer }
        workflowId: { type: string, format: uuid }
        workflowName: { type: string }
    IssueTypeInput:
      type: object
      required: [key, name, level, workflowId]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,30}$' }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string }
        icon: { type: string }
        color: { type: string }
        level: { type: integer, minimum: -1, maximum: 2 }
        workflowId: { type: string, format: uuid }
    CycleTimeReport:
      type: object
      required: [days, issues, averageHours, medianHours, p85Hours]
      properties:
        days: { type: integer }
        averageHours: { type: number, format: double }
        medianHours: { type: number, format: double }
        p85Hours: { type: number, format: double }
        issues:
          type: array
          items: { $ref: '#/components/schemas/CycleTimeIssue' }
        truncated: { type: boolean, description: 'More issues were resolved than a report reads (100,000); the most recent count' }
    CycleTimeIssue:
      type: object
      required: [key, summary, cycleHours, resolvedAt]
      properties:
        key: { type: string }
        summary: { type: string }
        cycleHours: { type: number, format: double }
        resolvedAt: { type: string, format: date-time }
        projectKey: { type: string }

    IssueMetrics:
      type: object
      required: [createdAt, ageHours, statusSince, statusAgeHours, timeInStatus, reopened, sprints]
      properties:
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, description: First entered an in-progress status }
        resolvedAt: { type: string, format: date-time }
        leadTimeHours: { type: number, format: double, description: Created to resolved (resolved issues only) }
        cycleTimeHours: { type: number, format: double, description: 'Started to resolved, or started to now while still open' }
        ageHours: { type: number, format: double, description: 'Created to now, or to resolution' }
        statusSince: { type: string, format: date-time, description: When the issue entered its current status }
        statusAgeHours: { type: number, format: double }
        timeInStatus:
          description: Total time in each status visited, in the order first visited
          type: array
          items: { $ref: '#/components/schemas/StatusTime' }
        reopened: { type: integer, description: Times it left a done status for another }
        sprints: { type: integer, description: Sprints it has been part of }
    StatusTime:
      type: object
      required: [status, hours, visits]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        hours: { type: number, format: double }
        visits: { type: integer }

    Dashboard:
      type: object
      required: [id, name, description, owner, shared, canEdit, gadgets, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner: { $ref: '#/components/schemas/User' }
        shared: { type: boolean, description: 'Visible to everyone in the organisation. Each gadget still shows only what the viewer may browse.' }
        canEdit: { type: boolean }
        gadgets: { type: array, items: { $ref: '#/components/schemas/Gadget' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DashboardInput:
      type: object
      required: [name, gadgets]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        shared: { type: boolean }
        gadgets: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/Gadget' } }
    Gadget:
      type: object
      required: [id, type, width, config]
      properties:
        id: { type: string, minLength: 1, maxLength: 40, description: Chosen by the client; unique within the dashboard }
        type: { $ref: '#/components/schemas/GadgetType' }
        title: { type: string, maxLength: 80 }
        width: { type: integer, minimum: 1, maximum: 3, description: Columns of a three-column grid }
        config: { $ref: '#/components/schemas/GadgetConfig' }
    GadgetType:
      type: string
      enum: [sprint_burndown, sprint_burnup, sprint_health, velocity, cumulative_flow, created_resolved, cycle_time, breakdown, stat, issue_list]
    GadgetConfig:
      type: object
      description: |
        Settings for a gadget; which apply depends on its type. Sprint gadgets and velocity use
        projectKey (and sprintId, else the active sprint, else the last completed one); the others
        use projectKeys (none means every project the viewer can browse) and jql.
      properties:
        projectKey: { type: string }
        sprintId: { type: string, format: uuid }
        projectKeys: { type: array, maxItems: 20, items: { type: string } }
        jql: { type: string, maxLength: 2000 }
        days: { type: integer, minimum: 1, maximum: 365 }
        interval: { type: string, enum: [day, week] }
        by: { $ref: '#/components/schemas/BreakdownBy' }
        flowBy: { type: string, enum: [category, status] }
        measure: { type: string, enum: [issues, points, hours], description: 'hours (remaining estimate and time logged) applies to sprint gadgets' }
        chart: { type: string, enum: [bar, donut] }
        stat: { $ref: '#/components/schemas/MetricStat' }
        count: { type: integer, minimum: 1, maximum: 20, description: Sprints shown by velocity }
        limit: { type: integer, minimum: 1, maximum: 50, description: Rows shown by an issue list }
    MetricStat:
      type: string
      enum: [open, todo, in_progress, created, resolved, overdue, unassigned, open_points, resolved_points, median_cycle_hours]

    MetricsSummary:
      type: object
      required: [days, open, todo, inProgress, created, resolved, overdue, unassigned, openPoints, resolvedPoints]
      properties:
        days: { type: integer }
        open: { type: integer, description: Not in a done status }
        todo: { type: integer }
        inProgress: { type: integer }
        created: { type: integer, description: Created in the window }
        resolved: { type: integer, description: Resolved in the window }
        overdue: { type: integer, description: Open with a due date before today }
        unassigned: { type: integer, description: Open without an assignee }
        openPoints: { type: number, format: double }
        resolvedPoints: { type: number, format: double, description: Story points resolved in the window }
        medianCycleHours: { type: number, format: double, description: Of issues resolved in the window }
    CumulativeFlow:
      type: object
      required: [days, dates, series]
      properties:
        days: { type: integer }
        dates: { type: array, items: { type: string, format: date } }
        series:
          type: array
          items: { $ref: '#/components/schemas/FlowSeries' }
        truncated: { type: boolean, description: 'More issues match than a report reads (100,000); the most recently created count' }
    FlowSeries:
      type: object
      required: [key, label, category, counts]
      properties:
        key: { type: string, description: A status category, or a status id }
        label: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        counts: { type: array, items: { type: integer }, description: One per date }
    CreatedResolved:
      type: object
      required: [days, interval, buckets]
      properties:
        days: { type: integer }
        interval: { type: string, enum: [day, week] }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/CreatedResolvedBucket' }
    CreatedResolvedBucket:
      type: object
      required: [start, created, resolved, open]
      properties:
        start: { type: string, format: date }
        created: { type: integer }
        resolved: { type: integer }
        open: { type: integer, description: Open at the end of the bucket }
    BreakdownBy:
      type: string
      enum: [status, statusCategory, priority, type, assignee, label, epic, sprint, release, project]
    Breakdown:
      type: object
      required: [by, total, totalPoints, groups]
      properties:
        by: { $ref: '#/components/schemas/BreakdownBy' }
        total: { type: integer }
        totalPoints: { type: number, format: double }
        groups:
          type: array
          items: { $ref: '#/components/schemas/BreakdownGroup' }
    BreakdownGroup:
      type: object
      required: [key, label, count, points]
      properties:
        key: { type: string, description: 'The value (an id, key or name); empty for "None"' }
        label: { type: string }
        count: { type: integer }
        points: { type: number, format: double }
        category: { $ref: '#/components/schemas/StatusCategory' }
        color: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Velocity:
      type: object
      required: [sprints, averagePoints, averageIssues]
      properties:
        averagePoints: { type: number, format: double, description: Completed points per sprint }
        averageIssues: { type: number, format: double }
        sprints:
          type: array
          items: { $ref: '#/components/schemas/VelocitySprint' }
    VelocitySprint:
      type: object
      required: [sprint, committedPoints, completedPoints, committedIssues, completedIssues]
      properties:
        sprint: { $ref: '#/components/schemas/Sprint' }
        committedPoints: { type: number, format: double }
        completedPoints: { type: number, format: double, description: 'All work done in the sprint, including work added after the start' }
        committedIssues: { type: integer }
        completedIssues: { type: integer }

    Workflow:
      type: object
      required: [id, name, description, shared, currentVersion, updatedAt, usage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        projectKey: { type: string }
        shared: { type: boolean }
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        usage:
          type: array
          items: { $ref: '#/components/schemas/WorkflowUsage' }
    WorkflowUsage:
      type: object
      required: [projectKey, issueTypeKey]
      properties:
        projectKey: { type: string }
        issueTypeKey: { type: string }
    WorkflowDetail:
      allOf:
        - $ref: '#/components/schemas/Workflow'
        - type: object
          required: [version]
          properties:
            version: { $ref: '#/components/schemas/WorkflowVersion' }
            pendingMigration: { type: boolean }
    WorkflowVersionSummary:
      type: object
      required: [version, publishedAt]
      properties:
        version: { type: integer }
        publishedAt: { type: string, format: date-time }
        publishedBy: { $ref: '#/components/schemas/User' }
        issueCount: { type: integer, description: Issues still pinned to this version }
    WorkflowVersion:
      allOf:
        - $ref: '#/components/schemas/WorkflowVersionSummary'
        - type: object
          required: [yaml, definition]
          properties:
            yaml: { type: string }
            definition: { $ref: '#/components/schemas/WorkflowDefinition' }
    WorkflowDefinition:
      type: object
      required: [name, statuses, transitions]
      properties:
        name: { type: string }
        description: { type: string }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStatusDef' }
        transitions:
          type: array
          items: { $ref: '#/components/schemas/TransitionDefinition' }
        layout:
          description: Node positions for the visual editor, keyed by status name.
          type: object
          additionalProperties: { $ref: '#/components/schemas/NodePosition' }
    WorkflowStatusDef:
      type: object
      required: [id, name, category, initial]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/StatusCategory' }
        initial: { type: boolean }
    NodePosition:
      type: object
      required: [x, y]
      properties:
        x: { type: number, format: double }
        y: { type: number, format: double }
    TransitionDefinition:
      type: object
      required: [id, name, to]
      properties:
        id: { type: string }
        name: { type: string }
        from:
          description: Source status ids; omitted means any status.
          type: array
          items: { type: string, format: uuid }
        to: { type: string, format: uuid }
        condition: { type: string, description: CEL expression deciding who may see and run the transition }
        validators:
          type: array
          items: { $ref: '#/components/schemas/ValidatorDef' }
        screen:
          type: array
          items: { $ref: '#/components/schemas/ScreenField' }
        postFunctions:
          type: array
          items: { $ref: '#/components/schemas/PostFunction' }
    ValidatorDef:
      type: object
      required: [expr]
      properties:
        expr: { type: string, description: CEL expression that must evaluate to true }
        message: { type: string }
    ScreenField:
      type: object
      required: [field]
      properties:
        field: { type: string, description: resolution, comment, assignee, a system field or a custom field key }
        required: { type: boolean }
    PostFunction:
      type: object
      description: Exactly one key is set.
      properties:
        assignTo: { type: string, description: 'actor | reporter | unassigned | <email>' }
        setField: { $ref: '#/components/schemas/SetFieldAction' }
        clearField: { type: string }
        notify: { type: string, description: 'assignee | reporter | watchers' }
        webhook: { type: string, description: URL receiving a signed JSON POST }
    SetFieldAction:
      type: object
      required: [field]
      properties:
        field: { type: string }
        value: {}
    WorkflowValidation:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationError' }
        definition: { $ref: '#/components/schemas/WorkflowDefinition' }
        removedStatuses:
          type: array
          items: { $ref: '#/components/schemas/RemovedStatus' }
    ValidationError:
      type: object
      required: [message]
      properties:
        path: { type: string }
        message: { type: string }
    RemovedStatus:
      type: object
      required: [name, issueCount]
      properties:
        name: { type: string }
        issueCount: { type: integer }
    WorkflowApplyResult:
      type: object
      required: [action, workflowId, version]
      properties:
        action: { type: string, enum: [created, published, unchanged] }
        workflowId: { type: string, format: uuid }
        version: { type: integer }
        migrationQueued: { type: boolean }

    Board:
      type: object
      required: [id, projectKey, name, type, filterJql, swimlanes, doneRetentionDays, columns, cardFields]
      properties:
        id: { type: string, format: uuid }
        projectKey: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/BoardType' }
        filterJql: { type: string }
        swimlanes: { $ref: '#/components/schemas/Swimlanes' }
        doneRetentionDays: { type: integer }
        columns: { type: array, items: { $ref: '#/components/schemas/BoardColumn' } }
        cardFields: { type: array, items: { $ref: '#/components/schemas/CardField' }, description: What cards show besides the summary, type and key, in this order }
    BoardType: { type: string, enum: [scrum, kanban] }
    CardField: { type: string, enum: [epic, labels, priority, dev, points, assignee, dueDate, daysInColumn, timeTracking] }
    Swimlanes: { type: string, enum: [none, assignee, epic, priority, type] }
    BoardColumn:
      type: object
      required: [name, statusIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        statusIds: { type: array, items: { type: string, format: uuid } }
        wipLimit: { type: integer, minimum: 1 }
    BoardInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/BoardType' }
        filterJql: { type: string }
        swimlanes: { $ref: '#/components/schemas/Swimlanes' }
        doneRetentionDays: { type: integer, minimum: 1, maximum: 365 }
        columns:
          description: Omit to derive one column per status from the project's workflows.
          type: array
          items: { $ref: '#/components/schemas/BoardColumn' }
        cardFields:
          description: Omit to keep the current fields (new boards get epic, labels, priority, dev, points and assignee).
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/CardField' }
    BoardData:
      type: object
      required: [board, columns, unmappedStatusIds, total]
      properties:
        board: { $ref: '#/components/schemas/Board' }
        total: { type: integer, description: 'Issues on the board; the columns hold at most 2,000 of them, in rank order' }
        sprint: { $ref: '#/components/schemas/Sprint' }
        columns:
          type: array
          items: { $ref: '#/components/schemas/BoardColumnData' }
        unmappedStatusIds:
          description: Statuses used by the project but not shown on any column.
          type: array
          items: { type: string, format: uuid }
    BoardColumnData:
      type: object
      required: [id, name, statusIds, issues, overLimit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        statusIds: { type: array, items: { type: string, format: uuid } }
        wipLimit: { type: integer }
        overLimit: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
    Backlog:
      type: object
      required: [sprints, backlog, backlogTotal]
      properties:
        sprints:
          type: array
          items: { $ref: '#/components/schemas/BacklogSprint' }
        backlog: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        backlogTotal: { type: integer, description: 'Issues in the backlog; `backlog` holds at most 2,000 of them, in rank order' }
    BacklogSprint:
      type: object
      required: [sprint, issues, total]
      properties:
        sprint: { $ref: '#/components/schemas/Sprint' }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        total: { type: integer, description: 'Issues in the sprint; `issues` holds at most 2,000 of them, in rank order' }
    Sprint:
      type: object
      required: [id, name, goal, state, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string }
        state: { $ref: '#/components/schemas/SprintState' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        completedAt: { type: string, format: date-time }
        position: { type: integer }
    SprintState: { type: string, enum: [future, active, closed] }
    SprintInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        goal: { type: string }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
    SprintReport:
      type: object
      required: [sprint, committedPoints, completedPoints, committedIssues, completedIssues, addedPoints, removedPoints, addedIssues, removedIssues, burndown, committedSeconds, completedSeconds, addedSeconds, removedSeconds]
      properties:
        sprint: { $ref: '#/components/schemas/Sprint' }
        committedPoints: { type: number, format: double, description: Story points in the sprint when it started }
        completedPoints: { type: number, format: double, description: 'Points done in the sprint, including work added after it started' }
        committedIssues: { type: integer }
        completedIssues: { type: integer }
        addedPoints: { type: number, format: double, description: Points of issues added after the start }
        removedPoints: { type: number, format: double, description: Points of issues taken out after the start }
        addedIssues: { type: integer }
        removedIssues: { type: integer }
        committedSeconds: { type: integer, format: int64, description: Remaining estimate of the open issues in the sprint when it started }
        completedSeconds: { type: integer, format: int64, description: Time logged on the sprint's issues during the sprint (counted when it was logged) }
        addedSeconds: { type: integer, format: int64, description: 'Remaining estimate of issues added after the start, when they were added' }
        removedSeconds: { type: integer, format: int64, description: 'Remaining estimate of issues taken out after the start, when they left' }
        burndown:
          type: array
          items: { $ref: '#/components/schemas/BurndownPoint' }
    BurndownPoint:
      type: object
      description: The sprint at the end of each day (today so far for an active sprint).
      required: [date, remainingPoints, idealPoints, scopePoints, completedPoints, remainingIssues, scopeIssues, completedIssues, remainingSeconds, idealSeconds, scopeSeconds, completedSeconds]
      properties:
        date: { type: string, format: date }
        remainingPoints: { type: number, format: double, description: Scope minus completed }
        idealPoints: { type: number, format: double, description: Committed points falling linearly to zero at the end date }
        scopePoints: { type: number, format: double }
        completedPoints: { type: number, format: double }
        remainingIssues: { type: integer }
        scopeIssues: { type: integer }
        completedIssues: { type: integer }
        remainingSeconds: { type: integer, format: int64, description: Remaining estimate of the issues in the sprint that are not done }
        idealSeconds: { type: integer, format: int64, description: Committed hours falling linearly to zero at the end date }
        scopeSeconds: { type: integer, format: int64, description: Time logged in the sprint so far plus the remaining estimate }
        completedSeconds: { type: integer, format: int64, description: Time logged on the sprint's issues since it started }
    Release:
      type: object
      required: [id, name, description, state, position, issueCount, doneCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        releaseDate: { type: string, format: date }
        state: { $ref: '#/components/schemas/ReleaseState' }
        releasedAt: { type: string, format: date-time }
        position: { type: integer }
        issueCount: { type: integer }
        doneCount: { type: integer }
    ReleaseState: { type: string, enum: [unreleased, released, archived] }
    ReleaseInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        startDate: { type: [string, 'null'], format: date }
        releaseDate: { type: [string, 'null'], format: date }
        state: { $ref: '#/components/schemas/ReleaseState' }

    IssueTypeRef:
      type: object
      required: [id, key, name, icon, color, level]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        color: { type: string }
        level: { type: integer }
    IssueRef:
      type: object
      required: [id, key, summary, type, status]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        summary: { type: string }
        type: { $ref: '#/components/schemas/IssueTypeRef' }
        status: { $ref: '#/components/schemas/Status' }
    DevSummary:
      type: object
      required: [branches, commits, pullRequests, openPullRequests, mergedPullRequests]
      properties:
        branches: { type: integer }
        commits: { type: integer }
        pullRequests: { type: integer }
        openPullRequests: { type: integer }
        mergedPullRequests: { type: integer }
        pipelineState: { type: string }
    Issue:
      type: object
      required: [id, key, projectKey, type, summary, status, priority, labels, rank, version, fields, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        projectKey: { type: string }
        type: { $ref: '#/components/schemas/IssueTypeRef' }
        summary: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        priority: { $ref: '#/components/schemas/Priority' }
        assignee: { $ref: '#/components/schemas/User' }
        reporter: { $ref: '#/components/schemas/User' }
        parent: { $ref: '#/components/schemas/IssueRef' }
        sprintId: { type: string, format: uuid }
        storyPoints: { type: number, format: double }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        labels: { type: array, items: { type: string } }
        resolution: { type: string }
        resolvedAt: { type: string, format: date-time }
        rank: { type: string }
        version: { type: integer }
        fields: { type: object, additionalProperties: true }
        dev: { $ref: '#/components/schemas/DevSummary' }
        statusChangedAt: { type: string, format: date-time, description: When the issue entered its current status }
        timeTracking: { $ref: '#/components/schemas/TimeTracking', description: Always present }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IssueDetail:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          required: [description, project, children, links, development, attachments, releases, watching, watcherCount, permissions]
          properties:
            description: { type: string }
            project: { $ref: '#/components/schemas/ProjectRef' }
            sprint: { $ref: '#/components/schemas/Sprint' }
            releases: { type: array, items: { $ref: '#/components/schemas/Release' } }
            children: { type: array, items: { $ref: '#/components/schemas/Issue' } }
            progress: { $ref: '#/components/schemas/IssueProgress' }
            links: { type: array, items: { $ref: '#/components/schemas/IssueLink' } }
            development: { type: array, items: { $ref: '#/components/schemas/DevLink' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
            watching: { type: boolean }
            watcherCount: { type: integer }
            suggestedBranch: { type: string }
            permissions: { $ref: '#/components/schemas/IssuePermissions' }
    ProjectRef:
      type: object
      required: [id, key, name]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
    IssueProgress:
      type: object
      required: [total, done, inProgress, points, donePoints]
      properties:
        total: { type: integer }
        done: { type: integer }
        inProgress: { type: integer }
        points: { type: number, format: double }
        donePoints: { type: number, format: double }
    IssuePermissions:
      type: object
      required: [edit, delete, transition, comment, assign]
      properties:
        edit: { type: boolean }
        delete: { type: boolean }
        transition: { type: boolean }
        comment: { type: boolean }
        assign: { type: boolean }
    IssueCreate:
      type: object
      required: [projectKey, typeKey, summary]
      properties:
        projectKey: { type: string }
        typeKey: { type: string }
        summary: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: string, format: uuid }
        parentKey: { type: string }
        sprintId: { type: string, format: uuid }
        storyPoints: { type: number, format: double }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        labels: { type: array, items: { type: string } }
        releaseIds: { type: array, items: { type: string, format: uuid } }
        fields: { type: object, additionalProperties: true }
        originalEstimate: { type: integer, format: int64, minimum: 0, description: Seconds; the remaining estimate starts equal to it unless given }
        remainingEstimate: { type: integer, format: int64, minimum: 0, description: Seconds }
    IssuePatch:
      type: object
      properties:
        version: { type: integer, description: Expected current version (optimistic locking) }
        typeKey: { type: string }
        summary: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: [string, 'null'], format: uuid }
        reporterId: { type: [string, 'null'], format: uuid }
        parentKey: { type: [string, 'null'] }
        sprintId: { type: [string, 'null'], format: uuid }
        storyPoints: { type: [number, 'null'], format: double }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        labels: { type: array, items: { type: string } }
        releaseIds: { type: array, items: { type: string, format: uuid } }
        fields:
          description: Custom field values to set; a null value clears the field.
          type: object
          additionalProperties: true
        originalEstimate: { type: [integer, 'null'], format: int64, minimum: 0, description: 'Seconds; setting it on an issue without a remaining estimate sets that too' }
        remainingEstimate: { type: [integer, 'null'], format: int64, minimum: 0, description: Seconds }
    AvailableTransition:
      type: object
      required: [id, name, to, screen]
      properties:
        id: { type: string }
        name: { type: string }
        to: { $ref: '#/components/schemas/Status' }
        screen:
          type: array
          items: { $ref: '#/components/schemas/ScreenFieldInfo' }
    ScreenFieldInfo:
      type: object
      required: [field, name, type, required]
      properties:
        field: { type: string }
        name: { type: string }
        type: { type: string }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
    TransitionRequest:
      type: object
      required: [transitionId]
      properties:
        transitionId: { type: string }
        version: { type: integer }
        fields: { type: object, additionalProperties: true, description: Values for the transition screen }
        comment: { type: string }
        commentVisibility: { $ref: '#/components/schemas/Visibility', description: 'Service projects: the comment is internal unless public' }
    MoveRequest:
      type: object
      properties:
        statusId: { type: string, format: uuid }
        transitionId: { type: string }
        sprintId:
          description: null moves the issue to the backlog; omit to leave the sprint unchanged.
          type: [string, 'null']
          format: uuid
        afterIssueId: { type: string, format: uuid }
        beforeIssueId: { type: string, format: uuid }
    Comment:
      type: object
      required: [id, body, source, createdAt, canEdit]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/User' }
        body: { type: string }
        source: { type: string }
        via: { type: string, description: 'What the author used, e.g. an AI assistant' }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time }
        canEdit: { type: boolean }
        visibility: { $ref: '#/components/schemas/Visibility', description: Service projects only }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 50000 }
        visibility: { $ref: '#/components/schemas/Visibility', description: 'Service projects: public replies to the customer; internal (the default for agents) is a note' }
    HistoryEntry:
      type: object
      required: [id, actorType, field, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/User' }
        actorType: { type: string }
        via: { type: string, description: 'What the person used, e.g. an AI assistant ("Ada via Claude")' }
        field: { type: string }
        from: { type: string }
        to: { type: string }
        createdAt: { type: string, format: date-time }
    TimeTracking:
      type: object
      description: Estimates and time logged, in seconds. A missing estimate was never set.
      required: [spentSeconds]
      properties:
        originalSeconds: { type: integer, format: int64, description: Original estimate }
        remainingSeconds: { type: integer, format: int64, description: Remaining estimate }
        spentSeconds: { type: integer, format: int64, description: "Time spent: the sum of the issue's worklogs" }
    TimeTrackingSettings:
      type: object
      required: [hoursPerDay, daysPerWeek]
      properties:
        hoursPerDay: { type: number, format: double, description: Hours in a working day (1d) }
        daysPerWeek: { type: number, format: double, description: Working days in a week (1w) }
    AdjustEstimate:
      type: string
      enum: [auto, leave]
      description: 'auto (the default) moves the remaining estimate by the time logged, never below zero; leave keeps it'
    Worklog:
      type: object
      required: [id, issueKey, startedAt, timeSpentSeconds, comment, createdAt, updatedAt, canEdit]
      properties:
        id: { type: string, format: uuid }
        issueKey: { type: string }
        author: { $ref: '#/components/schemas/User' }
        startedAt: { type: string, format: date-time, description: When the work was done }
        timeSpentSeconds: { type: integer, format: int64 }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        canEdit: { type: boolean, description: The caller may change or delete it }
    WorklogInput:
      type: object
      required: [timeSpentSeconds]
      properties:
        timeSpentSeconds: { type: integer, format: int64, minimum: 60 }
        startedAt: { type: string, format: date-time, description: Defaults to now }
        comment: { type: string, maxLength: 10000 }
        adjustEstimate: { $ref: '#/components/schemas/AdjustEstimate' }
        remainingEstimateSeconds: { type: integer, format: int64, minimum: 0, description: Set the remaining estimate to this instead of adjusting it }
    WorklogPatch:
      type: object
      properties:
        timeSpentSeconds: { type: integer, format: int64, minimum: 60 }
        startedAt: { type: string, format: date-time }
        comment: { type: string, maxLength: 10000 }
        adjustEstimate: { $ref: '#/components/schemas/AdjustEstimate' }
        remainingEstimateSeconds: { type: integer, format: int64, minimum: 0 }
    Timesheet:
      type: object
      required: [from, to, timeZone, dates, dayTotals, total, people]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        timeZone: { type: string }
        dates: { type: array, items: { type: string, format: date }, description: Every day from..to }
        dayTotals: { type: array, items: { type: integer, format: int64 }, description: Seconds logged each day }
        total: { type: integer, format: int64 }
        people:
          type: array
          description: People who logged time, most first
          items: { $ref: '#/components/schemas/TimesheetPerson' }
    TimesheetPerson:
      type: object
      required: [days, total, issues]
      properties:
        user: { $ref: '#/components/schemas/User', description: Missing when the author's account is gone }
        days: { type: array, items: { type: integer, format: int64 }, description: Seconds per date }
        total: { type: integer, format: int64 }
        issues:
          type: array
          items: { $ref: '#/components/schemas/TimesheetIssue' }
    TimesheetIssue:
      type: object
      required: [issue, days, total]
      properties:
        issue: { $ref: '#/components/schemas/IssueRef' }
        days: { type: array, items: { type: integer, format: int64 } }
        total: { type: integer, format: int64 }
    IssueLink:
      type: object
      required: [id, type, direction, label, issue]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/LinkType' }
        direction: { $ref: '#/components/schemas/LinkDirection' }
        label: { type: string }
        issue: { $ref: '#/components/schemas/IssueRef' }
    DevLink:
      type: object
      required: [id, kind, repository, externalId, title, url, state, authorName, data, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DevLinkKind' }
        repository: { $ref: '#/components/schemas/RepositoryRef' }
        externalId: { type: string }
        title: { type: string }
        url: { type: string }
        state: { type: string }
        authorName: { type: string }
        data: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }
    DevLinkKind: { type: string, enum: [branch, commit, pull_request, pipeline] }
    ScmProvider: { type: string, enum: [github, gitlab] }
    RepositoryRef:
      type: object
      required: [id, provider, fullPath, webUrl]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ScmProvider' }
        fullPath: { type: string }
        webUrl: { type: string }
    Attachment:
      type: object
      required: [id, filename, contentType, size, createdAt, url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        uploader: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        url: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility', description: 'Service projects: public = added by a customer in the portal (the only files the portal shows)' }

    Timeline:
      type: object
      required: [projects, issues, links, sprints, releases, truncated]
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/ProjectRef' } }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' }, description: 'Epics and standard issues in rank order (children name their parent)' }
        links: { type: array, items: { $ref: '#/components/schemas/TimelineLink' } }
        sprints: { type: array, items: { $ref: '#/components/schemas/TimelineSprint' } }
        releases: { type: array, items: { $ref: '#/components/schemas/TimelineRelease' } }
        truncated: { type: boolean, description: More issues matched than the timeline shows (2000) }
    TimelineLink:
      type: object
      required: [id, sourceKey, targetKey, type]
      properties:
        id: { type: string, format: uuid }
        sourceKey: { type: string, description: The blocking issue }
        targetKey: { type: string, description: The blocked issue }
        type: { type: string, enum: [blocks] }
    TimelineSprint:
      type: object
      required: [projectKey, sprint]
      properties:
        projectKey: { type: string }
        sprint: { $ref: '#/components/schemas/Sprint' }
    TimelineRelease:
      type: object
      required: [projectKey, release]
      properties:
        projectKey: { type: string }
        release: { $ref: '#/components/schemas/Release' }
    SearchResult:
      type: object
      required: [issues, total, limit, offset]
      properties:
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    SearchMetadata:
      type: object
      required: [fields, functions]
      properties:
        fields:
          type: array
          items: { $ref: '#/components/schemas/SearchField' }
        functions: { type: array, items: { type: string } }
    SearchField:
      type: object
      required: [name, type, operators]
      properties:
        name: { type: string }
        type: { type: string }
        operators: { type: array, items: { type: string } }
        values: { type: array, items: { type: string } }
    SavedFilter:
      type: object
      required: [id, name, description, jql, shared, owner, mine]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        jql: { type: string }
        shared: { type: boolean }
        owner: { $ref: '#/components/schemas/User' }
        mine: { type: boolean }
    SavedFilterInput:
      type: object
      required: [name, jql]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        jql: { type: string }
        shared: { type: boolean }

    FieldDefinition:
      type: object
      required: [id, key, name, description, type, options]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        options: { type: array, items: { type: string } }
        projectKeys: { type: array, items: { type: string }, description: Omitted = all projects }
        issueTypeKeys: { type: array, items: { type: string }, description: Omitted = all issue types }
    FieldType: { type: string, enum: [text, number, select, multiselect, user, date, version, checkbox, url] }
    FieldDefinitionInput:
      type: object
      required: [key, name, type]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,40}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        options: { type: array, items: { type: string } }
        projectKeys: { type: array, items: { type: string } }
        issueTypeKeys: { type: array, items: { type: string } }

    Notification:
      type: object
      required: [id, kind, title, body, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        issueKey: { type: string }
        actor: { $ref: '#/components/schemas/User' }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unread: { type: integer }

    EmailDelivery:
      type: string
      enum: [immediate, digest, "off"]
      description: immediate = within a couple of minutes (changes to one issue are combined); digest = in the daily digest; off = no email.
    EmailNotificationPreference:
      type: object
      required: [kind, label, description, delivery, defaultDelivery]
      properties:
        kind: { type: string, description: 'Notification kind: assigned, commented, transitioned or automation' }
        label: { type: string }
        description: { type: string }
        delivery: { $ref: '#/components/schemas/EmailDelivery' }
        defaultDelivery: { $ref: '#/components/schemas/EmailDelivery' }
        deliveries: { type: array, items: { $ref: '#/components/schemas/EmailDelivery' }, description: The choices this kind offers }
    EmailNotificationSettings:
      type: object
      required: [address, preferences, digestHour, timeZone, paused, nextDigestAt, emailConfigured]
      properties:
        address: { type: string, description: Where the emails go (your account's address) }
        preferences: { type: array, items: { $ref: '#/components/schemas/EmailNotificationPreference' } }
        digestHour: { type: integer, minimum: 0, maximum: 23, description: Hour of the day (in timeZone) the digest is sent }
        timeZone: { type: string, description: 'IANA time zone, e.g. Europe/London' }
        paused: { type: boolean, description: No notification emails at all while paused }
        lastDigestAt: { type: string, format: date-time }
        nextDigestAt: { type: string, format: date-time, description: When the next digest goes out if there is anything to send }
        emailConfigured: { type: boolean, description: False when the server has no SMTP server and only keeps mail in memory }
    EmailNotificationSettingsPatch:
      type: object
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [kind, delivery]
            properties:
              kind: { type: string }
              delivery: { $ref: '#/components/schemas/EmailDelivery' }
        digestHour: { type: integer, minimum: 0, maximum: 23 }
        timeZone: { type: string }
        paused: { type: boolean }
    EmailTransport: { type: string, enum: [smtp, memory] }
    EmailStatus:
      type: object
      required: [transport, from, publicUrl, unsubscribeUrl, batchWindowSeconds]
      properties:
        transport: { $ref: '#/components/schemas/EmailTransport' }
        host: { type: string }
        port: { type: integer }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string, description: SMTP user name if set (the password is never shown) }
        from: { type: string }
        publicUrl: { type: string, description: Links in emails point here (WFM_PUBLIC_URL) }
        unsubscribeUrl: { type: string, description: One-click unsubscribe endpoint (on WFM_HOOKS_PUBLIC_URL) }
        batchWindowSeconds: { type: integer, description: Immediate emails wait this long so changes to one issue arrive as one email }
    EmailTestResult:
      type: object
      required: [to, transport]
      properties:
        to: { type: string }
        transport: { $ref: '#/components/schemas/EmailTransport' }

    ScmConnection:
      type: object
      required: [id, provider, name, apiUrl, webUrl, manageHooks, writeBack, webhookUrl, createdAt, repositoryCount]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ScmProvider' }
        name: { type: string }
        apiUrl: { type: string }
        webUrl: { type: string }
        appId: { type: integer, format: int64 }
        appSlug: { type: string }
        manageHooks: { type: boolean }
        writeBack: { type: boolean }
        webhookUrl: { type: string, description: URL to configure as the App / hook delivery URL }
        createdAt: { type: string, format: date-time }
        lastEventAt: { type: string, format: date-time }
        repositoryCount: { type: integer }
    ScmConnectionCreated:
      allOf:
        - $ref: '#/components/schemas/ScmConnection'
        - type: object
          required: [webhookSecret]
          properties:
            webhookSecret: { type: string, description: The webhook secret (generated when not supplied); only returned on creation }
    ScmConnectionInput:
      type: object
      required: [provider, name]
      properties:
        provider: { $ref: '#/components/schemas/ScmProvider' }
        name: { type: string, minLength: 1, maxLength: 100 }
        apiUrl: { type: string, description: Defaults to https://api.github.com or https://gitlab.com }
        webUrl: { type: string }
        appId: { type: integer, format: int64, description: GitHub App id }
        appSlug: { type: string }
        privateKey: { type: string, description: GitHub App private key (PEM) }
        token: { type: string, description: GitLab group or project access token }
        webhookSecret: { type: string, description: Generated when omitted }
        manageHooks: { type: boolean, default: false }
        writeBack: { type: boolean, default: true }
    ScmConnectionPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        privateKey: { type: string }
        token: { type: string }
        webhookSecret: { type: string }
        manageHooks: { type: boolean }
        writeBack: { type: boolean }
    ScmRepository:
      type: object
      required: [id, connectionId, provider, fullPath, webUrl, defaultBranch, projectKeys]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ScmProvider' }
        fullPath: { type: string }
        webUrl: { type: string }
        defaultBranch: { type: string }
        projectKeys: { type: array, items: { type: string } }
    WebhookEvent:
      type: object
      required: [id, eventType, deliveryId, status, attempts, receivedAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        deliveryId: { type: string }
        status: { type: string, enum: [pending, processed, ignored, failed] }
        error: { type: string }
        attempts: { type: integer }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: string, format: date-time }

    # Import from Jira
    JiraFlavor:
      type: string
      enum: [cloud, datacenter]
      description: Jira Cloud (REST v3, email + API token) or Jira Data Center / Server (REST v2, personal access token)
    JiraConnectionInput:
      type: object
      required: [flavor, baseUrl, token]
      properties:
        flavor: { $ref: '#/components/schemas/JiraFlavor' }
        baseUrl: { type: string, description: 'Site URL, e.g. https://acme.atlassian.net or https://jira.example.com' }
        email: { type: string, description: Email of the Atlassian account that owns the API token (Cloud only) }
        token: { type: string, writeOnly: true, description: API token (Cloud) or personal access token (Data Center) }
    JiraConnectionTest:
      type: object
      required: [serverTitle, version, deploymentType, user]
      properties:
        serverTitle: { type: string }
        version: { type: string }
        deploymentType: { type: string }
        user:
          type: object
          required: [displayName]
          properties:
            displayName: { type: string }
            email: { type: string }
    JiraImportStatus:
      type: string
      enum: [draft, scanning, scanned, running, succeeded, failed, cancelled]
    JiraImport:
      type: object
      required: [id, flavor, baseUrl, email, serverTitle, hasCredentials, status, stalled, scanStale, config, targets, people, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        flavor: { $ref: '#/components/schemas/JiraFlavor' }
        baseUrl: { type: string }
        email: { type: string }
        serverTitle: { type: string }
        hasCredentials: { type: boolean }
        status: { $ref: '#/components/schemas/JiraImportStatus' }
        mode: { type: string, enum: [scan, import], description: The kind of the current or last run }
        stalled: { type: boolean, description: A run stopped checkpointing (worker restarted); it can be resumed or cancelled }
        scanStale: { type: boolean, description: The scan is missing or does not cover the selected projects }
        config: { $ref: '#/components/schemas/JiraImportConfig' }
        targets: { type: array, items: { $ref: '#/components/schemas/JiraImportTarget' } }
        scan: { $ref: '#/components/schemas/JiraScan' }
        people: { type: array, items: { $ref: '#/components/schemas/JiraPerson' } }
        progress: { $ref: '#/components/schemas/JiraImportProgress' }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    JiraImportPatch:
      type: object
      properties:
        config: { $ref: '#/components/schemas/JiraImportConfig' }
        email: { type: string, description: New account email (Cloud), with token }
        token: { type: string, writeOnly: true, description: New API token or personal access token }
    JiraImportConfig:
      type: object
      required: [projects, priorities, storyPointsField, people, componentsAsLabels, attachments]
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/JiraProjectTarget' } }
        priorities:
          type: object
          description: Jira priority id → priority here
          additionalProperties: { $ref: '#/components/schemas/Priority' }
        storyPointsField: { type: string, description: 'Jira field id holding story points; "none" to skip' }
        people:
          type: object
          description: Jira person id (account id or user key) → how they are represented here
          additionalProperties: { $ref: '#/components/schemas/JiraPersonMapping' }
        componentsAsLabels: { type: boolean, description: 'Import components as labels named "component:<name>"' }
        attachments: { type: boolean, description: Download attachments (up to the attachment size limit) }
    JiraProjectTarget:
      type: object
      required: [jiraId, jiraKey, jiraName, key, name, template, open, statuses, types]
      properties:
        jiraId: { type: string }
        jiraKey: { type: string }
        jiraName: { type: string }
        key: { type: string, description: Project key here (issues keep their numbers) }
        name: { type: string }
        template: { type: string, description: 'scrum, kanban or bug_tracking; empty = from the Jira boards' }
        open: { type: boolean, description: Open to every organisation member; otherwise private }
        statuses:
          type: object
          description: Jira status id → status name here
          additionalProperties: { type: string }
        types:
          type: object
          description: Jira issue type id → issue type key here
          additionalProperties: { type: string }
    JiraPersonMapping:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [auto, user, placeholder, skip]
          description: 'auto: the account with the same email, else a placeholder; user: a chosen account; placeholder: always a placeholder; skip: leave empty'
        userId: { type: string, format: uuid }
        email: { type: string, description: Email for the placeholder (lets the person claim it by signing in) }
    JiraImportTarget:
      type: object
      required: [jiraId, statuses, types]
      properties:
        jiraId: { type: string }
        existingKey: { type: string, description: Key of the project an earlier run created }
        statuses:
          type: array
          items:
            type: object
            required: [name, category]
            properties:
              name: { type: string }
              category: { $ref: '#/components/schemas/StatusCategory' }
        types:
          type: array
          items:
            type: object
            required: [key, name, level, statuses]
            properties:
              key: { type: string }
              name: { type: string }
              level: { type: integer }
              statuses: { type: array, items: { type: string } }
    JiraProject:
      type: object
      required: [id, key, name, type, teamManaged]
      properties:
        id: { type: string }
        key: { type: string }
        name: { type: string }
        type: { type: string }
        teamManaged: { type: boolean }
        lead: { type: string }
        importedAs: { type: string, description: Key here of the project an earlier import of this site created }
    JiraValueCount:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer }
    JiraScan:
      type: object
      required: [complete, projects, priorities, people, storyPointFields, oversizeAttachments, oversizeCount]
      properties:
        complete: { type: boolean }
        scannedAt: { type: string, format: date-time }
        projects: { type: array, items: { $ref: '#/components/schemas/JiraScanProject' } }
        priorities: { type: array, items: { $ref: '#/components/schemas/JiraValueCount' } }
        people:
          type: array
          items: { $ref: '#/components/schemas/JiraScanPerson' }
        storyPointFields: { type: array, items: { $ref: '#/components/schemas/JiraValueCount' } }
        oversizeAttachments:
          type: array
          items:
            type: object
            required: [issueKey, filename, size]
            properties:
              issueKey: { type: string }
              filename: { type: string }
              size: { type: integer, format: int64 }
        oversizeCount: { type: integer }
    JiraScanProject:
      type: object
      required: [jiraId, key, name, boardType, issues, maxNumber, comments, attachments, attachmentBytes, sprints, versions, statuses, types, pairs]
      properties:
        jiraId: { type: string }
        key: { type: string }
        name: { type: string }
        boardType: { type: string }
        issues: { type: integer }
        maxNumber: { type: integer }
        comments: { type: integer }
        attachments: { type: integer }
        attachmentBytes: { type: integer, format: int64 }
        sprints: { type: integer }
        versions: { type: integer }
        statuses:
          type: array
          items:
            type: object
            required: [id, name, category, count]
            properties:
              id: { type: string }
              name: { type: string }
              category: { $ref: '#/components/schemas/StatusCategory' }
              count: { type: integer }
        types:
          type: array
          items:
            type: object
            required: [id, name, level, count]
            properties:
              id: { type: string }
              name: { type: string }
              level: { type: integer }
              count: { type: integer }
        pairs:
          type: array
          description: Issues per Jira issue type and status
          items:
            type: object
            required: [type, status, count]
            properties:
              type: { type: string }
              status: { type: string }
              count: { type: integer }
    JiraScanPerson:
      type: object
      required: [id, displayName, email, active, app, count]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string }
        active: { type: boolean }
        app: { type: boolean }
        count: { type: integer }
    JiraPerson:
      allOf:
        - $ref: '#/components/schemas/JiraScanPerson'
        - type: object
          required: [placeholder]
          properties:
            match:
              type: object
              description: The account with the same email, or the one an earlier run mapped the person to
              required: [id, displayName, email, active]
              properties:
                id: { type: string, format: uuid }
                displayName: { type: string }
                email: { type: string }
                active: { type: boolean }
            placeholder: { type: boolean, description: The match is an unclaimed placeholder from an earlier import }
    JiraImportProblem:
      type: object
      required: [severity, kind, message, count]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        kind: { type: string }
        project: { type: string }
        message: { type: string }
        count: { type: integer }
        examples: { type: array, items: { type: string } }
    JiraImportProgress:
      type: object
      required: [phases, counters, problems]
      properties:
        phases:
          type: array
          items:
            type: object
            required: [key, label, status, done, total]
            properties:
              key: { type: string }
              label: { type: string }
              status: { type: string, enum: [pending, running, done] }
              done: { type: integer }
              total: { type: integer }
        counters: { type: object, additionalProperties: { type: integer } }
        problems: { type: array, items: { $ref: '#/components/schemas/JiraImportProblem' } }
    JiraDryRun:
      type: object
      required: [ready, projects, people, problems]
      properties:
        ready: { type: boolean, description: No problem blocks the import }
        projects:
          type: array
          items:
            type: object
            required: [jiraKey, key, name, template, existing, issues, comments, attachments, attachmentBytes, skippedAttachments, sprints, versions]
            properties:
              jiraKey: { type: string }
              key: { type: string }
              name: { type: string }
              template: { type: string }
              existing: { type: boolean, description: The project exists from an earlier run and is updated }
              issues: { type: integer }
              comments: { type: integer }
              attachments: { type: integer }
              attachmentBytes: { type: integer, format: int64 }
              skippedAttachments: { type: integer }
              sprints: { type: integer }
              versions: { type: integer }
        people:
          type: object
          required: [matched, placeholders, unclaimable, skipped]
          properties:
            matched: { type: integer }
            placeholders: { type: integer }
            unclaimable: { type: integer }
            skipped: { type: integer }
        problems: { type: array, items: { $ref: '#/components/schemas/JiraImportProblem' } }

    AutomationTrigger:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [issue.created, issue.transitioned, issue.field_changed, pr.opened, pr.merged, commit.pushed, branch.created, pipeline.completed, schedule, sla.breached]
        toStatus: { type: string, description: 'issue.transitioned: only when entering this status (name)' }
        toCategory: { $ref: '#/components/schemas/StatusCategory', description: 'issue.transitioned: only when entering a status of this category' }
        field: { type: string, description: 'issue.field_changed: the field(s) to watch, comma-separated (e.g. "startDate, dueDate")' }
        cron: { type: string, description: 'schedule: 5-field cron expression (UTC)' }
        jql: { type: string, description: 'schedule: issues to run the actions against' }
    AutomationAction:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [transition, assign, set_field, comment, add_label, webhook, notify, rollup_dates, chat]
          description: 'rollup_dates sets the target issue''s start and due dates to span its children'
        target:
          type: string
          enum: [issue, parent, children]
          description: 'Which issue(s) the action applies to: the triggering issue (default), its parent (e.g. the epic of a story) or its children'
        status: { type: string, description: 'transition: target status name' }
        category: { $ref: '#/components/schemas/StatusCategory', description: 'transition: move to a status of this category instead of a named status (the first one the workflow allows)' }
        assignee: { type: string, description: 'assign: actor | reporter | unassigned | <email>' }
        field: { type: string }
        value: {}
        body: { type: string, description: 'comment: Markdown body' }
        label: { type: string }
        url: { type: string }
        recipients: { type: string, description: 'notify: assignee | reporter | watchers' }
        channelId: { type: string, format: uuid, description: 'chat: one of the project''s chat channels (body is the message, Markdown with {{issue.*}} / {{trigger.*}} / {{event.*}})' }
    AutomationRule:
      type: object
      required: [id, name, description, enabled, trigger, condition, actions, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        condition: { type: string, description: Optional CEL expression }
        actions: { type: array, items: { $ref: '#/components/schemas/AutomationAction' } }
        lastRunAt: { type: string, format: date-time }
        nextRunAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    AutomationRuleInput:
      type: object
      required: [name, trigger, actions]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        enabled: { type: boolean, default: true }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        condition: { type: string }
        actions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AutomationAction' } }
    AutomationRun:
      type: object
      required: [id, status, message, depth, createdAt]
      properties:
        id: { type: integer, format: int64 }
        issueKey: { type: string }
        status: { type: string, enum: [success, skipped, failed] }
        message: { type: string }
        depth: { type: integer }
        createdAt: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      required: [id, name, url, events, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectKey: { type: string }
        name: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    WebhookSubscriptionInput:
      type: object
      required: [name, url, events]
      properties:
        projectKey: { type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: ['*', issue.created, issue.updated, issue.transitioned, issue.deleted, comment.created, sprint.started, sprint.completed, release.released, sla.breached]
        active: { type: boolean, default: true }
    WebhookSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          required: [secret]
          properties:
            secret: { type: string }
    ChatProvider: { type: string, enum: [slack, mattermost] }
    ChatEvent:
      type: string
      enum: ['*', issue.created, issue.transitioned, issue.assigned, comment.created, sprint.started, sprint.completed, release.released, pr.opened, pr.merged, pipeline.failed]
    ChatChannel:
      type: object
      required: [id, provider, name, events, jql, active, urlHint, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/ChatProvider' }
        name: { type: string, description: 'Label for people, e.g. #team-payments' }
        events: { type: array, items: { $ref: '#/components/schemas/ChatEvent' } }
        jql: { type: string, description: Only issues matching this query notify (issue events) }
        active: { type: boolean }
        urlHint: { type: string, description: 'Host and last characters of the webhook URL (the URL itself is never returned)' }
        createdAt: { type: string, format: date-time }
    ChatChannelInput:
      type: object
      required: [provider, name, webhookUrl, events]
      properties:
        provider: { $ref: '#/components/schemas/ChatProvider' }
        name: { type: string, minLength: 1, maxLength: 100 }
        webhookUrl: { type: string, description: The channel's incoming webhook URL }
        events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ChatEvent' } }
        jql: { type: string }
        active: { type: boolean, default: true }
    ChatChannelPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        webhookUrl: { type: string, description: Omit to keep the current URL }
        events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ChatEvent' } }
        jql: { type: string }
        active: { type: boolean }
    ChatDelivery:
      type: object
      required: [id, event, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        issueKey: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        responseStatus: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      required: [id, event, status, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        responseStatus: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }

    # AI assistants (OAuth)
    OAuthScope:
      type: string
      enum: ['mcp:read', 'mcp:write']
      description: mcp:read = the MCP read tools; mcp:write = also the tools that create, edit, comment on and move issues.
    OAuthClient:
      type: object
      required: [id, name, kind, host]
      properties:
        id: { type: string, description: Generated for apps that registered themselves; the metadata document URL otherwise }
        name: { type: string, description: The name the app gives itself }
        kind:
          type: string
          enum: [dynamic, metadata]
          description: dynamic = registered itself (RFC 7591); metadata = identified by a client ID metadata document served from its own https URL
        host: { type: string, description: The host serving a metadata document (verified), or the host of a registered app's first redirect URI }
        clientUri: { type: string }
        logoUri: { type: string }
    OAuthConsent:
      type: object
      required: [client, redirectUri, redirectHost, nativeRedirect, requestedScopes, alreadyGranted]
      properties:
        client: { $ref: '#/components/schemas/OAuthClient' }
        redirectUri: { type: string }
        redirectHost: { type: string, description: Host (or app scheme) the browser returns to }
        nativeRedirect: { type: boolean, description: The browser returns to an app on this computer (a loopback address or an app link) }
        requestedScopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' } }
        grantedScopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' }, description: What you allowed this app before, if anything }
        alreadyGranted: { type: boolean, description: An earlier approval covers this request }
    OAuthConsentDecision:
      type: object
      required: [request, approve]
      properties:
        request: { type: string }
        approve: { type: boolean }
        scopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' }, description: Required when approving; among those requested }
    OAuthRedirect:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl: { type: string }
    ConnectedApp:
      type: object
      required: [id, client, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/OAuthClient' }
        scopes: { type: array, items: { $ref: '#/components/schemas/OAuthScope' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User', description: The person who connected it (administration listing) }

    # Service desk -------------------------------------------------------------
    Visibility:
      type: string
      enum: [public, internal]
      description: 'Service requests only: a public reply reaches the customer (portal and email); an internal note only agents see.'
    PortalAccess:
      type: string
      enum: [customers, organisation]
      description: 'Who may raise requests: customers = people on the customer list; organisation = also every organisation member (not guests)'
    ServiceDesk:
      type: object
      required: [projectKey, portalName, portalDescription, portalAccess, selfSignup, portalUrl, customerCount, openProject]
      properties:
        projectKey: { type: string }
        portalName: { type: string }
        portalDescription: { type: string }
        portalAccess: { $ref: '#/components/schemas/PortalAccess' }
        selfSignup: { type: boolean, description: Anyone may create a customer account from the portal (confirmed by email) }
        portalUrl: { type: string }
        customerCount: { type: integer }
        openProject: { type: boolean, description: 'The project is open: every organisation member can browse it as an agent, internal notes included' }
    ServiceDeskPatch:
      type: object
      properties:
        portalName: { type: string, minLength: 1, maxLength: 100 }
        portalDescription: { type: string, maxLength: 2000 }
        portalAccess: { $ref: '#/components/schemas/PortalAccess' }
        selfSignup: { type: boolean }
    FormFieldType:
      type: string
      enum: [text, textarea, select, multiselect, number, date, checkbox, url]
    RequestFormField:
      type: object
      required: [field, label, required]
      properties:
        field: { type: string, description: 'summary, description, priority, dueDate or a custom field key (not user or version fields)' }
        label: { type: string }
        help: { type: string }
        required: { type: boolean }
        type: { $ref: '#/components/schemas/FormFieldType', description: Derived from the field (ignored on input) }
        options: { type: array, items: { type: string }, description: Choices of select fields (ignored on input) }
    RequestApprovalConfig:
      type: object
      required: [mode, approvedStatus, declinedStatus]
      properties:
        mode: { type: string, enum: [any, all], description: 'any: one approval is enough; all: every approver must approve. One decline declines.' }
        approverIds: { type: array, items: { type: string, format: uuid } }
        groupId: { type: string, format: uuid, description: The group's members when the request is raised are asked too }
        approvedStatus: { type: string, description: Status the request moves to when approved }
        declinedStatus: { type: string, description: Status the request moves to when declined }
        approvers: { type: array, items: { $ref: '#/components/schemas/PortalPerson' }, description: The named approvers (output) }
        groupName: { type: string, description: Output }
    RequestTypeRef:
      type: object
      required: [id, name, icon]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string }
    RequestType:
      type: object
      required: [id, name, description, icon, issueType, group, position, fields, requestCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        issueType: { $ref: '#/components/schemas/IssueTypeRef' }
        group: { type: string, description: Portal group heading ("" for none) }
        position: { type: integer }
        fields: { type: array, items: { $ref: '#/components/schemas/RequestFormField' } }
        approval: { $ref: '#/components/schemas/RequestApprovalConfig' }
        requestCount: { type: integer }
    RequestTypeInput:
      type: object
      required: [name, issueTypeKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        icon: { type: string, description: 'help, bug, laptop, key, access, question, change or document' }
        issueTypeKey: { type: string }
        group: { type: string, maxLength: 60 }
        position: { type: integer }
        fields: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/RequestFormField' } }
        approval: { $ref: '#/components/schemas/RequestApprovalConfig' }
    ServiceCustomer:
      type: object
      required: [user, addedAt, account]
      properties:
        user: { $ref: '#/components/schemas/User' }
        addedAt: { type: string, format: date-time }
        account: { type: string, enum: [customer, member], description: 'customer: a portal-only account; member: an organisation account' }
        invited: { type: boolean, description: Has not chosen a password yet }
        active: { type: boolean }
    ServiceCustomerInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        displayName: { type: string, maxLength: 120 }
    ServiceCustomerAdded:
      type: object
      required: [customer, invited]
      properties:
        customer: { $ref: '#/components/schemas/ServiceCustomer' }
        invited: { type: boolean, description: A new customer account was created and emailed an invitation }
    Queue:
      type: object
      required: [id, name, jql, position, count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        jql: { type: string, description: 'Within the project; e.g. assignee is EMPTY AND resolution = Unresolved ORDER BY "Time to resolution"' }
        position: { type: integer }
        count: { type: integer }
    QueueInput:
      type: object
      required: [name, jql]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        jql: { type: string, maxLength: 4000 }
        position: { type: integer }
    QueueItem:
      type: object
      required: [issue, slas]
      properties:
        issue: { $ref: '#/components/schemas/Issue' }
        requestType: { $ref: '#/components/schemas/RequestTypeRef' }
        slas: { type: array, items: { $ref: '#/components/schemas/Sla' } }
    QueueIssues:
      type: object
      required: [queue, total, items]
      properties:
        queue: { $ref: '#/components/schemas/Queue' }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }
    SlaMetric: { type: string, enum: [first_response, resolution] }
    Sla:
      type: object
      required: [metric, name, state, targetSeconds, elapsedSeconds, remainingSeconds, breached]
      properties:
        metric: { $ref: '#/components/schemas/SlaMetric' }
        name: { type: string }
        state: { type: string, enum: [running, paused, stopped] }
        targetSeconds: { type: integer, format: int64 }
        elapsedSeconds: { type: integer, format: int64, description: Working time used (in the goal's calendar) }
        remainingSeconds: { type: integer, format: int64, description: Working time left; negative once breached }
        breached: { type: boolean }
        breachAt: { type: string, format: date-time, description: 'Running clocks: when the goal is (or was) missed' }
        stoppedAt: { type: string, format: date-time }
        calendar: { type: string, description: Calendar name; omitted = around the clock }
    SlaHours:
      type: object
      required: [day, start, end]
      properties:
        day: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        start: { type: string, description: 'HH:MM' }
        end: { type: string, description: 'HH:MM (24:00 for midnight)' }
    SlaCalendar:
      type: object
      required: [name, timeZone, hours, holidays]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        timeZone: { type: string, description: 'IANA time zone, e.g. Europe/London' }
        hours: { type: array, items: { $ref: '#/components/schemas/SlaHours' }, description: No hours = around the clock }
        holidays: { type: array, items: { type: string }, description: 'Days off, YYYY-MM-DD' }
    SlaGoal:
      type: object
      required: [targetMinutes]
      properties:
        priorities: { type: array, items: { $ref: '#/components/schemas/Priority' }, description: Only requests of these priorities (empty = any) }
        requestTypeIds: { type: array, items: { type: string, format: uuid }, description: Only requests of these types (empty = any) }
        jql: { type: string, description: Only requests matching this query (empty = any) }
        targetMinutes: { type: integer, minimum: 1, maximum: 5256000 }
        calendar: { type: string, description: Calendar name; omitted = around the clock }
    SlaMetricConfig:
      type: object
      required: [metric, name, pauseStatuses, goals]
      properties:
        metric: { $ref: '#/components/schemas/SlaMetric' }
        name: { type: string }
        pauseStatuses: { type: array, items: { type: string }, description: Status names in which the clock pauses }
        goals: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/SlaGoal' }, description: The first goal whose conditions match a request applies }
    SlaConfig:
      type: object
      required: [calendars, metrics]
      properties:
        calendars: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SlaCalendar' } }
        metrics: { type: array, items: { $ref: '#/components/schemas/SlaMetricConfig' } }
    PortalPerson:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        avatarUrl: { type: string }
    Approver:
      type: object
      required: [person]
      properties:
        person: { $ref: '#/components/schemas/PortalPerson' }
        decision: { type: string, enum: [approved, declined] }
        comment: { type: string }
        decidedAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, status, mode, approvers, createdAt, canDecide]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, declined] }
        mode: { type: string, enum: [any, all] }
        approvers: { type: array, items: { $ref: '#/components/schemas/Approver' } }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        canDecide: { type: boolean, description: The caller is an approver who has not decided yet }
    ApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, decline] }
        comment: { type: string, maxLength: 5000 }
    ServiceRequest:
      type: object
      required: [issueKey, slas, approvals, participants, portalUrl, customerVisible]
      properties:
        issueKey: { type: string }
        requestType: { $ref: '#/components/schemas/RequestTypeRef' }
        channel: { type: string, enum: [portal, agent] }
        slas: { type: array, items: { $ref: '#/components/schemas/Sla' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        participants: { type: array, items: { $ref: '#/components/schemas/User' } }
        portalUrl: { type: string }
        customerVisible: { type: boolean, description: The reporter and participants see it in the portal (it has a request type) }
    ServiceRequestPatch:
      type: object
      required: [requestTypeId]
      properties:
        requestTypeId: { type: string, format: uuid }
    ParticipantInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
    PortalDeskRef:
      type: object
      required: [projectKey, name]
      properties:
        projectKey: { type: string }
        name: { type: string }
    PortalDesk:
      type: object
      required: [projectKey, name, description, requestTypeCount]
      properties:
        projectKey: { type: string }
        name: { type: string }
        description: { type: string }
        requestTypeCount: { type: integer }
    PortalFormField:
      type: object
      required: [key, label, type, required]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        type: { $ref: '#/components/schemas/FormFieldType' }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
    PortalRequestType:
      type: object
      required: [id, name, description, icon, group, fields, needsApproval]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        group: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/PortalFormField' } }
        needsApproval: { type: boolean }
    PortalDeskDetail:
      type: object
      required: [projectKey, name, description, requestTypes]
      properties:
        projectKey: { type: string }
        name: { type: string }
        description: { type: string }
        requestTypes: { type: array, items: { $ref: '#/components/schemas/PortalRequestType' } }
    PortalRequestCreate:
      type: object
      required: [requestTypeId, values]
      properties:
        requestTypeId: { type: string, format: uuid }
        values: { type: object, additionalProperties: true, description: Form values by field key }
    PortalRequest:
      type: object
      required: [key, summary, status, requestType, desk, reporter, createdAt, updatedAt, role]
      properties:
        key: { type: string }
        summary: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        requestType: { $ref: '#/components/schemas/RequestTypeRef' }
        desk: { $ref: '#/components/schemas/PortalDeskRef' }
        reporter: { $ref: '#/components/schemas/PortalPerson' }
        resolution: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role: { type: string, enum: [reporter, participant, approver], description: Why the caller sees it }
    PortalFieldValue:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        type: { $ref: '#/components/schemas/FormFieldType' }
    PortalComment:
      type: object
      required: [id, author, body, createdAt, fromSupport]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/PortalPerson' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        fromSupport: { type: boolean, description: An agent's reply (not written in the portal) }
    PortalAttachment:
      type: object
      required: [id, filename, contentType, size, createdAt, url]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        url: { type: string }
    PortalRequestDetail:
      allOf:
        - $ref: '#/components/schemas/PortalRequest'
        - type: object
          required: [fields, comments, attachments, approvals, participants, canComment]
          properties:
            fields: { type: array, items: { $ref: '#/components/schemas/PortalFieldValue' } }
            comments: { type: array, items: { $ref: '#/components/schemas/PortalComment' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/PortalAttachment' } }
            approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
            participants: { type: array, items: { $ref: '#/components/schemas/PortalPerson' } }
            canComment: { type: boolean }
    PortalCommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 50000 }
    PortalSignupInfo:
      type: object
      required: [projectKey, name, description]
      properties:
        projectKey: { type: string }
        name: { type: string }
        description: { type: string }
    PortalSignup:
      type: object
      required: [email, displayName]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
