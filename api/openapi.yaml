  /metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [metrics]
      summary: Counts and totals for the matching issues (open, created and resolved in the window, overdue...)
      parameters: [{ $ref: '#/components/parameters/MetricProjects' }, { $ref: '#/components/parameters/MetricJql' }, { $ref: '#/components/parameters/MetricDays' }]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSummary' }
        default: { $ref: '#/components/responses/Problem' }
  /metrics/flow:
    get:
      operationId: getCumulativeFlow
      tags: [metrics]
      summary: Cumulative flow, the number of matching issues in each status (or category) at the end of each day
      parameters:
        - { $ref: '#/components/parameters/MetricProjects' }
        - { $ref: '#/components/parameters/MetricJql' }
        - { $ref: '#/components/parameters/MetricDays' }
        - { name: by, in: query, schema: { type: string, enum: [category, status], default: category } }
      responses:
        "200":
          description: 'One series per category or status (todo, in progress, done). Issues resolved before the window are left out, so the done band is work finished in it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CumulativeFlow' }
        default: { $ref: '#/components/responses/Problem' }
