        "200":
          description: Labels in use
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectKey}/issue-types:
    get:
      operationId: listIssueTypes
      tags: [projects]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      responses:
        "200":
          description: Issue types and their workflow mapping
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IssueType' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createIssueType
      tags: [projects]
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueTypeInput' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueType' }
        default: { $ref: '#/components/responses/Problem' }
  /projects/{projectKey}/issue-types/{typeId}:
    patch:
      operationId: updateIssueType
      tags: [projects]
      description: |
        Changing `workflowId` re-maps existing issues of this type; statuses missing from the new
        workflow must be mapped in `statusMapping` (old status name -> new status name).
      parameters: [{ $ref: '#/components/parameters/ProjectKey' }, { $ref: '#/components/parameters/TypeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                description: { type: string }
                icon: { type: string }
                color: { type: string }
                workflowId: { type: string, format: uuid }
                statusMapping:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueType' }
        default: { $ref: '#/components/responses/Problem' }
