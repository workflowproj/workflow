  # ---------------------------------------------------------------------------
  # AI assistants: OAuth consent and connected apps
  # ---------------------------------------------------------------------------
  /oauth/consent:
    get:
      operationId: getOAuthConsent
      tags: [me]
      summary: What an AI assistant asks for, shown on the consent page (browser session only)
      parameters:
        - { name: request, in: query, required: true, description: The sealed authorisation request /oauth/authorize passed to the consent page, schema: { type: string } }
      responses:
        "200":
          description: The app, where it returns to and the access it asks for
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthConsent' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: decideOAuthConsent
      tags: [me]
      summary: Approve or deny an AI assistant (browser session only); returns where to send the browser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthConsentDecision' }
      responses:
        "200":
          description: The app's redirect URI with an authorisation code, or with error=access_denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthRedirect' }
        default: { $ref: '#/components/responses/Problem' }
  /me/connected-apps:
    get:
      operationId: listMyConnectedApps
      tags: [me]
      summary: AI assistants and other apps you allowed to act for you over OAuth
      responses:
        "200":
          description: Connected apps, most recently used first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedApp' }
        default: { $ref: '#/components/responses/Problem' }
  /me/connected-apps/{grantId}:
    delete:
      operationId: revokeMyConnectedApp
      tags: [me]
      summary: Disconnect an app; its tokens stop working and it must ask again
      parameters: [{ $ref: '#/components/parameters/GrantId' }]
      responses:
        "204": { description: Disconnected }
        default: { $ref: '#/components/responses/Problem' }
  /admin/connected-apps:
    get:
      operationId: adminListConnectedApps
      tags: [admin]
      summary: Every person's connected apps
      responses:
        "200":
          description: Connected apps, most recently used first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedApp' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/connected-apps/{grantId}:
    delete:
      operationId: adminRevokeConnectedApp
      tags: [admin]
      summary: Disconnect anyone's app
      parameters: [{ $ref: '#/components/parameters/GrantId' }]
      responses:
        "204": { description: Disconnected }
        default: { $ref: '#/components/responses/Problem' }

