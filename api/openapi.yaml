  # ---------------------------------------------------------------------------
  # Workflows
  # ---------------------------------------------------------------------------
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      parameters:
        - { name: project, in: query, description: Project key; returns its workflows plus shared ones, schema: { type: string } }
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workflow' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createWorkflow
      tags: [workflows]
      description: Create a workflow from YAML and publish version 1. Omit `projectKey` for a shared workflow (org admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                projectKey: { type: string }
                yaml: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /workflows/apply:
    put:
      operationId: applyWorkflow
      tags: [workflows]
      description: |
        Workflows as code. Create the named workflow or publish a new version when the document changed;
        a no-op when it is identical. Used by `wfm workflow apply` from CI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                projectKey: { type: string }
                yaml: { type: string }
                statusMapping:
                  type: object
                  additionalProperties: { type: string }
                dryRun: { type: boolean, default: false }
      responses:
        "200":
          description: Result of the apply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowApplyResult' }
        default: { $ref: '#/components/responses/Problem' }
  /workflows/validate:
    post:
      operationId: validateWorkflow
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                workflowId:
                  description: When set, also report statuses removed relative to the current version.
                  type: string
                  format: uuid
      responses:
        "200":
          description: Validation result (always 200; check `valid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowValidation' }
        default: { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        "200":
          description: Workflow with its current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDetail' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        "204": { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      tags: [workflows]
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      responses:
        "200":
          description: Published versions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkflowVersionSummary' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: publishWorkflowVersion
      tags: [workflows]
      description: |
        Publish a new version. When it removes a status that issues are in, `statusMapping`
        (old status name -> new status name) is required; a migration job then moves the issues.
      parameters: [{ $ref: '#/components/parameters/WorkflowId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
                statusMapping:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /workflows/{workflowId}/versions/{version}:
    get:
      operationId: getWorkflowVersion
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/WorkflowId' }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: A specific version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowVersion' }
        default: { $ref: '#/components/responses/Problem' }

