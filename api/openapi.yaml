openapi: 3.1.0
info:
  title: Workflow Platform API
  version: 1.0.0
  description: |
    REST API for the workflow platform: projects, issues, configurable workflows, boards, sprints,
    releases, search (a JQL-like query language), Git integration, provisioning and automation.

    Authenticate with the browser session cookie or a personal access token
    (`Authorization: Bearer wfm_pat_...`). Cookie-authenticated mutations must send
    `X-Requested-With: XMLHttpRequest`. OAuth access tokens issued to AI assistants
    (`wfm_oat_...`) are valid for `/mcp` only.

    Errors use RFC 9457 problem details (`application/problem+json`).
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: users
  - name: admin
  - name: projects
  - name: workflows
  - name: boards
  - name: sprints
  - name: releases
  - name: issues
  - name: search
  - name: dashboards
  - name: metrics
  - name: scm
  - name: automation
  - name: webhooks
  - name: fields
  - name: handwritten
    description: Implemented outside the generated server (streaming).

paths:
  # ---------------------------------------------------------------------------
  # Auth & current user
  # ---------------------------------------------------------------------------
  /auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      security: []
      summary: Sign-in options for the login page
      responses:
        "200":
          description: Enabled providers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviders' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/dev-login:
    post:
      operationId: devLogin
      tags: [auth]
      security: []
      summary: Passwordless login for local development (disabled in production)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/login:
    post:
      operationId: localLogin
      tags: [auth]
      security: []
      summary: Sign in with an email address and a password (local accounts)
      description: |
        On success the session cookie is set (`status: signed_in`). Otherwise the result says what
        comes next - `totp_required`, `password_change_required` (a temporary password) or
        `totp_enrollment_required` (`WFM_LOCAL_REQUIRE_2FA`) - and an HttpOnly cookie carries the
        unfinished sign-in to that step. Wrong credentials always get the same 401. Throttled per
        client address and per email (429 with `Retry-After`); repeated failures lock the account
        for a while (429, code `locked`). 404 when `WFM_LOCAL_LOGIN=false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in, or the next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLoginResult' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/login/totp:
    post:
      operationId: localLoginTotp
      tags: [auth]
      security: []
      summary: Second sign-in step - an authenticator code or a recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: '6-digit code, or a recovery code such as k7dmr-x3qpa' }
      responses:
        "200":
          description: Signed in, or the next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLoginResult' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/login/new-password:
    post:
      operationId: localLoginNewPassword
      tags: [auth]
      security: []
      summary: Replace a temporary password during sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string }
      responses:
        "200":
          description: Signed in, or the next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLoginResult' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/login/totp-setup:
    post:
      operationId: localLoginTotpSetup
      tags: [auth]
      security: []
      summary: Start the two-factor enrolment required at sign-in
      responses:
        "200":
          description: The secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/login/totp-setup/confirm:
    post:
      operationId: localLoginTotpConfirm
      tags: [auth]
      security: []
      summary: Finish two-factor enrolment at sign-in; the result carries the recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLoginResult' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/forgot-password:
    post:
      operationId: localForgotPassword
      tags: [auth]
      security: []
      summary: Email a password-reset link (valid for one hour) to a local account
      description: Answers 202 whether or not an account exists for the address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: If the address has a local account, a link is on its way }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/link:
    post:
      operationId: localLinkInfo
      tags: [auth]
      security: []
      summary: Check an invitation or password-reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Who the link is for (404 `invalid_link` when used, expired or unknown)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLink' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/link/redeem:
    post:
      operationId: localRedeemLink
      tags: [auth]
      security: []
      summary: Choose a password with an invitation or reset link (single use)
      description: Ends every session of the person; they then sign in with the new password (and two-factor if on).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalLink' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/local/password-check:
    post:
      operationId: localCheckPassword
      tags: [auth]
      security: []
      summary: Rate a password against the policy while someone types it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                email: { type: string }
                displayName: { type: string }
      responses:
        "200":
          description: Strength and policy problems
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordCheck' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      description: >-
        Ends the session. When it came from a sign-in provider with single logout on
        (WFM_OIDC_<ID>_SINGLE_LOGOUT), the response is the provider's end-session URL to send the
        browser to, so the person is signed out there too and comes back to /login.
      responses:
        "200":
          description: Signed out here; finish at the sign-in provider
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "204": { description: Signed out }
        default: { $ref: '#/components/responses/Problem' }
  /me:
    get:
      operationId: getMe
      tags: [me]
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
  /me/tokens:
    get:
      operationId: listMyTokens
      tags: [me]
      responses:
        "200":
          description: Personal access tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMyToken
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        "201":
          description: Created; the token value is only returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /me/tokens/{tokenId}:
    delete:
      operationId: revokeMyToken
      tags: [me]
      parameters: [{ $ref: '#/components/parameters/TokenId' }]
      responses:
        "204": { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /me/security:
    get:
      operationId: getMySecurity
      tags: [me]
      summary: How the signed-in person signs in (password, two-factor)
      responses:
        "200":
          description: Sign-in and two-factor status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySecurity' }
        default: { $ref: '#/components/responses/Problem' }
  /me/password:
    post:
      operationId: changeMyPassword
      tags: [me]
      summary: Change your password (local accounts); ends your other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "204": { description: Changed }
        default: { $ref: '#/components/responses/Problem' }
  /me/totp/setup:
    post:
      operationId: setupMyTotp
      tags: [me]
      summary: Start setting up two-factor authentication
      responses:
        "200":
          description: The secret to add to an authenticator app; confirm it with a code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }
        default: { $ref: '#/components/responses/Problem' }
  /me/totp/confirm:
    post:
      operationId: confirmMyTotp
      tags: [me]
      summary: Turn two-factor authentication on with a code from the new secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: On; the recovery codes are shown only now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        default: { $ref: '#/components/responses/Problem' }
  /me/totp/disable:
    post:
      operationId: disableMyTotp
      tags: [me]
      summary: Turn two-factor authentication off (needs your password and a code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, description: Authenticator code or a recovery code }
      responses:
        "204": { description: Off }
        default: { $ref: '#/components/responses/Problem' }
  /me/totp/recovery-codes:
    post:
      operationId: regenerateMyRecoveryCodes
      tags: [me]
      summary: Replace your recovery codes (needs a code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: New codes; the old ones stop working
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCodes' }
        default: { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      operationId: listNotifications
      tags: [me]
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        default: { $ref: '#/components/responses/Problem' }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Omit to mark everything read.
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Marked read }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------------------
  # Email notifications
  # ---------------------------------------------------------------------------
  /me/email-notifications:
    get:
      operationId: getMyEmailNotifications
      tags: [me]
      summary: Your email notification settings
      responses:
        "200":
          description: Settings (the defaults until you change something)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailNotificationSettings' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMyEmailNotifications
      tags: [me]
      summary: Change your email notification settings
      description: Only the fields sent change; preferences are merged by kind.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailNotificationSettingsPatch' }
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailNotificationSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/email:
    get:
      operationId: adminGetEmailStatus
      tags: [admin]
      summary: How outgoing email is configured
      responses:
        "200":
          description: Email configuration (the SMTP password is never returned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailStatus' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/email/test:
    post:
      operationId: adminSendTestEmail
      tags: [admin]
      summary: Send a test email to yourself
      description: Sent right away rather than queued, so SMTP errors come back in the response (502).
      responses:
        "200":
          description: Sent (or kept in memory when no SMTP server is configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTestResult' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------------------
  # Directory
  # ---------------------------------------------------------------------------
  /users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: project, in: query, description: Only users who can be assigned in this project, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        "200":
          description: Active users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }
  /groups:
    get:
      operationId: listGroups
      tags: [users]
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Problem' }
  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [users]
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      responses:
        "200":
          description: Group with members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /roles:
    get:
      operationId: listRoles
      tags: [users]
      responses:
        "200":
          description: Project roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        default: { $ref: '#/components/responses/Problem' }
  /permissions:
    get:
      operationId: listPermissions
      tags: [users]
      responses:
        "200":
          description: Named permissions that roles can hold
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionInfo' }
        default: { $ref: '#/components/responses/Problem' }
  /statuses:
    get:
      operationId: listStatuses
      tags: [workflows]
      responses:
        "200":
          description: All statuses across workflows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Status' }
        default: { $ref: '#/components/responses/Problem' }

  # ---------------------------------------------------------------------------
  # Administration
  # ---------------------------------------------------------------------------
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/UserKind' } }
      responses:
        "200":
          description: All users including inactive
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: adminCreateUser
      tags: [admin]
      description: Pre-provision a person, or create a service account (`kind=service`) for CI and the CLI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                kind: { $ref: '#/components/schemas/UserKind' }
                email: { type: string, format: email }
                displayName: { type: string, minLength: 1, maxLength: 200 }
                orgRole: { $ref: '#/components/schemas/OrgRole' }
                groupIds:
                  description: Local groups to add the person to.
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 200 }
                orgRole: { $ref: '#/components/schemas/OrgRole' }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/invitation:
    post:
      operationId: adminInviteUser
      tags: [admin]
      summary: Email a person an invitation to choose a password (makes them a local account)
      description: A new invitation replaces any open one. Refused for people managed by SCIM or Google directory sync.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt]
                properties:
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: adminRevokeInvitation
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/temporary-password:
    post:
      operationId: adminSetTemporaryPassword
      tags: [admin]
      summary: Set a generated temporary password (returned once; changed at next sign-in)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "200":
          description: The temporary password
          content:
            application/json:
              schema:
                type: object
                required: [password]
                properties:
                  password: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/password-reset:
    post:
      operationId: adminSendPasswordReset
      tags: [admin]
      summary: Email a local account a password-reset link
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "202": { description: Sent }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/unlock:
    post:
      operationId: adminUnlockUser
      tags: [admin]
      summary: Clear a lockout after repeated failed sign-ins
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Unlocked }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/totp:
    delete:
      operationId: adminResetTotp
      tags: [admin]
      summary: Turn off a person's two-factor authentication (lost device)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Reset }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/password:
    delete:
      operationId: adminRemovePassword
      tags: [admin]
      summary: Remove a person's password and two-factor (back to single sign-on only)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "204": { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/tokens:
    get:
      operationId: adminListUserTokens
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        "200":
          description: Tokens owned by the user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: adminCreateUserToken
      tags: [admin]
      description: Issue a token for a service account.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/tokens/{tokenId}:
    delete:
      operationId: adminRevokeToken
      tags: [admin]
      parameters: [{ $ref: '#/components/parameters/TokenId' }]
      responses:
        "204": { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups:
    post:
      operationId: adminCreateGroup
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string }
                orgRole: { $ref: '#/components/schemas/OrgRole' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        default: { $ref: '#/components/responses/Problem' }
  /admin/groups/{groupId}:
    patch:
      operationId: adminUpdateGroup
      tags: [admin]
      description: Provisioned groups only accept `orgRole` (a local mapping); local groups accept everything.
      parameters: [{ $ref: '#/components/parameters/GroupId' }]
      requestBody:
        required: true
        content:
