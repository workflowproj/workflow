{{- with .Values.secrets.externalSecret }}
{{- if and .enabled (not $.Values.secrets.existingSecret) }}
{{- if not .secretStoreRef.name }}
{{- fail "secrets.externalSecret.secretStoreRef.name is required" }}
{{- end }}
{{- if not (or .data .dataFrom) }}
{{- fail "secrets.externalSecret needs data or dataFrom" }}
{{- end }}
apiVersion: {{ .apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "wfm.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wfm.labels" $ | nindent 4 }}
  annotations:
    {{- include "wfm.syncWave" $.Values.argocd.syncWaves.config | nindent 4 }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: {{ .secretStoreRef.kind }}
    name: {{ .secretStoreRef.name }}
  target:
    name: {{ include "wfm.secretName" $ }}
    creationPolicy: Owner
    deletionPolicy: Retain
  {{- with .data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
