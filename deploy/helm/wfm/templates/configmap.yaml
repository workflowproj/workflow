apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wfm.fullname" . }}-config
  labels:
    {{- include "wfm.labels" . | nindent 4 }}
  annotations:
    {{- include "wfm.syncWave" .Values.argocd.syncWaves.config | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if not (kindIs "invalid" $v) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
