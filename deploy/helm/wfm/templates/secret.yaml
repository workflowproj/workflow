{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.externalSecret.enabled) }}
{{- if and (eq (toString (index .Values.config "WFM_ENV")) "production") (not (index .Values.secrets.values "WFM_SECRET_KEY")) }}
{{- fail "secrets.values.WFM_SECRET_KEY is required when config.WFM_ENV=production (32+ random characters)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wfm.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wfm.labels" . | nindent 4 }}
  annotations:
    {{- include "wfm.syncWave" .Values.argocd.syncWaves.config | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.database.cnpg.enabled) (not .Values.database.external.existingSecret) .Values.database.external.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wfm.fullname" . }}-database
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wfm.labels" . | nindent 4 }}
  annotations:
    {{- include "wfm.syncWave" .Values.argocd.syncWaves.config | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.database.external.url | quote }}
{{- end }}
