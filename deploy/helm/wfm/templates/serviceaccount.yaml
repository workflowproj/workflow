{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wfm.serviceAccountName" . }}
  labels:
    {{- include "wfm.labels" . | nindent 4 }}
  annotations:
    {{- include "wfm.syncWave" .Values.argocd.syncWaves.config | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
