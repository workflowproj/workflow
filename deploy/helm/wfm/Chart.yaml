apiVersion: v2
name: wfm
description: >-
  Workflow management platform: one image running as web (UI + API), hooks (internet-facing
  webhooks and SCIM) and worker (River jobs), with an optional CloudNativePG database.
type: application
# Bumped by release-please in the release PR (the x-release-please-version lines only); the
# release workflow also packages with the tag.
version: 0.2.0 # x-release-please-version
appVersion: "0.2.0" # x-release-please-version
# preStop sleep hooks (lifecycle.preStop.sleep) need Kubernetes 1.30+.
kubeVersion: ">=1.30.0-0"
home: https://github.com/workflowproj/workflow
sources:
  - https://github.com/workflowproj/workflow
keywords:
  - workflow
  - issue-tracker
  - cloudnative-pg
  - keda
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
