# Throwaway PostgreSQL 17 for the inner loop (Tilt) and quick k3d tests, used through
# database.external.existingSecret=wfm-dev-database. Not for production: use CloudNativePG.
apiVersion: v1
kind: Secret
metadata:
  name: wfm-dev-database
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: wfm-dev
type: Opaque
stringData:
  POSTGRES_USER: wfm
  POSTGRES_PASSWORD: wfm
  POSTGRES_DB: wfm
  uri: postgres://wfm:wfm@postgres:5432/wfm?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: wfm-dev
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: wfm-dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: wfm-dev
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wfm-dev-database
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wfm", "-d", "wfm"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# The chart's default-deny-ingress policy covers every pod in the namespace; let the app reach this DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: wfm-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 5432
          protocol: TCP
