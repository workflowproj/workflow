version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_methods_with_db_argument: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { type: float64, pointer: true }
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: tsvector
            go_type: string
