name: Release

# Tag vX.Y.Z -> multi-arch image (signed, SBOM attested), Helm chart (OCI, signed),
# offline bundles (amd64 + arm64) and a GitHub release. release-please.yml creates the tag and the
# release (with the changelog) and dispatches this workflow on the tag; a tag pushed by hand works too.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/workflowproj/workflow
  CHART_REGISTRY: oci://ghcr.io/workflowproj/charts
  HELM_VERSION: v3.19.0

jobs:
  image:
    name: Image (linux/amd64, linux/arm64)
    # Only release tags: a dispatch from a branch would publish a non-semver version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # Cosign keyless signing (Fulcio/Rekor via GitHub OIDC)
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      # The Node and Go stages run on the build platform and cross-compile, and the runtime stage
      # only copies files, so no QEMU is needed for the arm64 image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
      - name: Verify signature and attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  chart:
    name: Helm chart (OCI)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Cosign reads registry credentials from the Docker config, not Helm's registry login.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        run: |
          mkdir -p dist
          helm lint --strict deploy/helm/wfm
          helm package deploy/helm/wfm --version "${VERSION}" --app-version "${VERSION}" --destination dist
      - name: Push to ghcr.io and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/wfm-${VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          test -n "${digest}"
          cosign sign --yes "${CHART_REGISTRY#oci://}/wfm@${digest}"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/wfm-*.tgz

  bundle:
    name: Offline bundle (${{ matrix.arch }})
    needs: [image, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - name: Build the bundle
        run: |
          scripts/bundle.sh \
            --version "${VERSION}" \
            --arch "${{ matrix.arch }}" \
            --image "${IMAGE}@${{ needs.image.outputs.digest }}" \
            --chart "dist/wfm-${VERSION}.tgz" \
            --out bundle
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            bundle/*.tar.gz
            bundle/*.tar.gz.sha256

  release:
    name: GitHub release
    needs: [image, chart, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum ./* | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The release usually exists already, with release-please's changelog: add to it.
          append_body: true
          files: assets/*
          body: |
            Image: `${{ env.IMAGE }}:${{ needs.image.outputs.version }}` (`${{ needs.image.outputs.digest }}`)
            Chart: `helm install wfm ${{ env.CHART_REGISTRY }}/wfm --version ${{ needs.image.outputs.version }}`

            Verify the image:
            ```
            cosign verify ${{ env.IMAGE }}@${{ needs.image.outputs.digest }} \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
