name: Release Please

# Conventional commits on main -> a release PR with the next semver version, CHANGELOG.md and the
# chart version. Merging it tags vX.Y.Z and creates the GitHub release; release.yml then builds and
# attaches the artifacts. A tag pushed with GITHUB_TOKEN triggers no workflows, so release.yml is
# started with workflow_dispatch on the new tag instead.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      - name: Build and publish the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
